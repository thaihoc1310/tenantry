name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine
        env: { POSTGRES_USER: tenantry, POSTGRES_PASSWORD: tenantry, POSTGRES_DB: tenantry }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U tenantry" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: generated code matches the spec
        run: make generate && git diff --exit-code
      - run: make fmt-check
      - run: make vet
      - uses: golangci/golangci-lint-action@v6
        with: { working-directory: backend, args: --timeout=5m }
      - run: make test
      - run: make build
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: make web-install
      - name: generated client matches the spec
        run: cd web && npm run generate && git diff --exit-code
      - run: make web-check
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make chart-lint
      - run: make image
  operator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: operator/go.sum
      - name: generated code, CRDs and chart match the Go types
        run: make operator-generate && git diff --exit-code
      - run: make operator-fmt-check
      - run: make operator-vet
      - uses: golangci/golangci-lint-action@v6
        with: { working-directory: operator, args: --timeout=5m }
      - run: make operator-test
      - run: make operator-build
      - run: make operator-chart-lint
      - run: make operator-image
