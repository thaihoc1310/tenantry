apiVersion: v1
kind: Namespace
metadata:
  name: identity-system
  labels:
    app.kubernetes.io/part-of: capsule-lab
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: capsule-lab-selfsigned
  namespace: identity-system
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: capsule-lab-root-ca
  namespace: identity-system
spec:
  isCA: true
  commonName: Capsule Lab Root CA
  secretName: capsule-lab-root-ca
  duration: 87600h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    kind: Issuer
    name: capsule-lab-selfsigned
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: capsule-lab-ca
  namespace: identity-system
spec:
  ca:
    secretName: capsule-lab-root-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: keycloak-tls
  namespace: identity-system
spec:
  secretName: keycloak-tls
  commonName: keycloak.127.0.0.1.nip.io
  duration: 8760h
  renewBefore: 720h
  dnsNames:
    - keycloak.127.0.0.1.nip.io
    - keycloak
    - keycloak.identity-system.svc
    - keycloak.identity-system.svc.cluster.local
  ipAddresses:
    - 10.96.200.10
  issuerRef:
    kind: Issuer
    name: capsule-lab-ca
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-bootstrap
  namespace: identity-system
type: Opaque
stringData:
  username: admin
  password: CapsuleKeycloak!2026
---
