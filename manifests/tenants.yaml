apiVersion: capsule.clastix.io/v1beta2
kind: Tenant
metadata:
  name: solar
  labels:
    demo.capsule.dev/tenant: solar
spec:
  owners:
    - kind: Group
      name: solar-owners
  forceTenantPrefix: true
  nodeSelector:
    capsule.clastix.io/tenant: solar
  namespaceOptions:
    quota: 5
    additionalMetadataList:
      - annotations:
          cni.projectcalico.org/ipv4pools: '["solar-ippool"]'
        labels:
          demo.capsule.dev/tenant: solar
          pod-security.kubernetes.io/enforce: baseline
          pod-security.kubernetes.io/audit: restricted
          pod-security.kubernetes.io/warn: restricted
    forbiddenAnnotations:
      denied:
        - cni.projectcalico.org/ipv4pools
        - cni.projectcalico.org/ipv6pools
  additionalRoleBindings:
    - clusterRoleName: edit
      labels:
        reflection.proxy.projectcapsule.dev/enabled: "true"
      subjects:
        - apiGroup: rbac.authorization.k8s.io
          kind: Group
          name: solar-developers
  serviceOptions:
    allowedServices:
      externalName: false
      loadBalancer: false
      nodePort: false
    externalIPs:
      allowed: []
  rules:
    - enforce:
        action: allow
        workloads:
          targets:
            - pod/containers
            - pod/initcontainers
          registries:
            - exp: "docker.io/.*"
              policy: ["IfNotPresent", "Always"]
            - exp: "quay.io/.*"
              policy: ["IfNotPresent", "Always"]
            - exp: "registry.k8s.io/.*"
              policy: ["IfNotPresent", "Always"]
            - exp: "ghcr.io/.*"
              policy: ["IfNotPresent", "Always"]
    - enforce:
        action: deny
        workloads:
          qosClasses:
            - BestEffort
            - Burstable
