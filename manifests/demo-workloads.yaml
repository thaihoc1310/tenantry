apiVersion: apps/v1
kind: Deployment
metadata:
  name: solar-web
  namespace: solar-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: solar-web
  template:
    metadata:
      labels:
        app: solar-web
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: docker.io/nginxinc/nginx-unprivileged:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: solar-web
  namespace: solar-dev
spec:
  selector:
    app: solar-web
  ports:
    - port: 80
      targetPort: 8080
---
