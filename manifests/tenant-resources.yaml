apiVersion: capsule.clastix.io/v1beta2
kind: GlobalTenantResource
metadata:
  name: capsule-lab-namespace-baseline
spec:
  resyncPeriod: 60s
  resources:
    - rawItems:
        - apiVersion: v1
          kind: LimitRange
          metadata:
            name: tenant-default-limits
          spec:
            limits:
              - type: Container
                default:
                  cpu: 250m
                  memory: 256Mi
                defaultRequest:
                  cpu: 250m
                  memory: 256Mi
                max:
                  cpu: "1"
                  memory: 1Gi
                min:
                  cpu: 25m
                  memory: 32Mi
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: tenant-info
          data:
            tenant: "{{tenant.name}}"
            namespace: "{{namespace}}"
            managed-by: capsule
        - apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: tenant-isolation
          spec:
            podSelector: {}
            policyTypes: [Ingress, Egress]
            ingress:
              - from:
                  - namespaceSelector:
                      matchLabels:
                        capsule.clastix.io/tenant: "{{tenant.name}}"
            egress:
              - to:
                  - namespaceSelector:
                      matchLabels:
                        capsule.clastix.io/tenant: "{{tenant.name}}"
              - to:
                  - namespaceSelector:
                      matchLabels:
                        kubernetes.io/metadata.name: kube-system
                    podSelector:
                      matchLabels:
                        k8s-app: kube-dns
                ports:
                  - protocol: UDP
                    port: 53
                  - protocol: TCP
                    port: 53
---
apiVersion: capsule.clastix.io/v1beta2
kind: ResourcePool
metadata:
  name: solar-compute
spec:
  config:
    defaultsZero: true
  selectors:
    - matchLabels:
        demo.capsule.dev/tenant: solar
  quota:
    hard:
      pods: "20"
      requests.cpu: "4"
      requests.memory: 8Gi
      limits.cpu: "4"
      limits.memory: 8Gi
---
apiVersion: capsule.clastix.io/v1beta2
kind: ResourcePool
metadata:
  name: water-compute
spec:
  config:
    defaultsZero: true
  selectors:
    - matchLabels:
        demo.capsule.dev/tenant: water
  quota:
    hard:
      pods: "10"
      requests.cpu: "2"
      requests.memory: 4Gi
      limits.cpu: "2"
      limits.memory: 4Gi
