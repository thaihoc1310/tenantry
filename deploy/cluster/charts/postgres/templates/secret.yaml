{{- /*
Passwords are generated on the first install and read back from the live
Secret on every upgrade (lookup), so they never change under data that was
initialised with them. `helm template` and --dry-run cannot look up, and print
fresh values; only a real install or upgrade matters.
*/ -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace "postgres").data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: postgres
  annotations:
    # Uninstalling the chart keeps the Secret: the PVC outlives the release
    # too, and its data only opens with these passwords.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range concat (list "postgres") .Values.databases }}
  {{- $key := printf "%s-password" . }}
  {{ $key }}: {{ get $existing $key | default (randAlphaNum 32 | b64enc) }}
  {{- end }}
