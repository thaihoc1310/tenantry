# yaml-language-server: $schema=https://raw.githubusercontent.com/projectcapsule/capsule/v0.15.2/charts/capsule/values.schema.json
# Capsule (architecture/05-network-and-scheduling.md §2, §8). Tenants are not
# created here: the Workspace Controller renders them from M6 on.

manager:
  options:
    # Who Capsule treats as a tenant user. Group Sync keeps every user with a
    # Workspace binding in tenantry:tenant-users (M4), and kube-apiserver
    # prefixes token groups with oidc: (70-apiserver.sh). This replaces the
    # chart's placeholder group projectcapsule.dev. The Workspace Operator
    # counts too: an owner of every Tenant, it creates the Namespaces asked
    # for on the portal, and Capsule only lets its users do that. Its
    # namespace holds nothing else (architecture/06 §7).
    users:
      - kind: Group
        name: oidc:tenantry:tenant-users
      - kind: Group
        name: system:serviceaccounts:tenantry-operator
    # Capsule reconciles Tenants and GlobalTenantResources one at a time by
    # default: with several Workspaces at once, each waits for the others
    # (docs/report/benchmark.md). Four workers in parallel, and a client rate
    # that does not throttle them. workers is ALPHA in Capsule 0.15.
    workers: 4
    clientConnectionQPS: 40
    clientConnectionBurst: 80
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 512Mi}

nodeSelector: &system
  tenantry.io/compute-pool: system
tolerations: &tolerate-system
  - key: tenantry.io/compute-pool
    operator: Equal
    value: system
    effect: NoSchedule

# The chart's hook Jobs (CRD lifecycle, cleanup) run on the system pool too.
global:
  jobs:
    kubectl:
      nodeSelector: *system
      tolerations: *tolerate-system
