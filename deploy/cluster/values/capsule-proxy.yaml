# yaml-language-server: $schema=https://raw.githubusercontent.com/projectcapsule/capsule-proxy/v0.15.3/charts/capsule-proxy/values.schema.json
# Capsule Proxy: the tenants' door to the Kubernetes API (05 §8), public at
# kube-a.<zone> through Traefik (manifests/kube-a-ingress.yaml).

options:
  # TLS ends at Traefik; the proxy speaks plain HTTP inside the cluster.
  enableSSL: false
  generateCertificates: false
  # A request carries the user's Keycloak token. The proxy asks
  # kube-apiserver who that is (TokenReview), so the user is exactly the one
  # kube-apiserver sees: oidc:<sub> with oidc:-prefixed groups.
  authPreferredTypes: BearerToken
  # The chart always passes --oidc-username-claim. Unused on the BearerToken
  # path (the user comes from TokenReview); sub matches kube-apiserver.
  oidcUsernameClaim: sub
  logLevel: 2
  # Cluster-scoped objects only through GlobalProxySettings (none here):
  # without it, every member of a Tenant reads the Nodes its nodeSelector
  # picks, with the proxy's own rights (labels, internal IPs, every image
  # cached on a shared node). With it a tenant gets an empty Node list, and
  # a Node, its subresources or metrics are asked with the tenant's own
  # rights: 403. Alpha in 0.15.3: check again on every proxy upgrade. The
  # proxy reads API discovery once at start and exits if an APIService is
  # down: cluster-verify checks every APIService is Available.
  extraArgs:
    - --feature-gates=ProxyClusterScoped=true
certManager:
  generateCertificates: false

nodeSelector: &system
  tenantry.io/compute-pool: system
tolerations: &tolerate-system
  - key: tenantry.io/compute-pool
    operator: Equal
    value: system
    effect: NoSchedule
global:
  jobs:
    kubectl:
      nodeSelector: *system
      tolerations: *tolerate-system
    certs:
      nodeSelector: *system
      tolerations: *tolerate-system
