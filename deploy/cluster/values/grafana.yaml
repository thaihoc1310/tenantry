# Grafana for the lab's Prometheus: one replica, sqlite in an emptyDir, no
# Ingress (kubectl -n observability port-forward svc/grafana 3000:80). The
# admin password is generated by the chart into the Secret grafana.
persistence: {enabled: false}
testFramework: {enabled: false}
resources:
  requests: {cpu: 50m, memory: 128Mi}
  limits: {memory: 256Mi}
nodeSelector:
  tenantry.io/compute-pool: system
tolerations:
  - key: tenantry.io/compute-pool
    operator: Equal
    value: system
    effect: NoSchedule
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        url: http://prometheus-server.observability.svc
        isDefault: true
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: tenantry
        folder: Tenantry
        type: file
        options: {path: /var/lib/grafana/dashboards/tenantry}
# The ConfigMap is made by 90-observability.sh from deploy/observability/.
dashboardsConfigMaps:
  tenantry: grafana-dashboards-tenantry
