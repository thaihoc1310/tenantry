# tenantry-operator on this cluster (make deploy-operator). The image is
# loaded into the system nodes' containerd, like the backend's.

# Central plane: the system pool (architecture/05-network-and-scheduling.md §1).
nodeSelector:
  tenantry.io/compute-pool: system
tolerations:
  - key: tenantry.io/compute-pool
    operator: Equal
    value: system
    effect: NoSchedule

# kubeadm's admin group: 10-nodes.sh labels and taints the system pool.
nodeLabelAdmins:
  - kubeadm:cluster-admins

# Prometheus metrics over HTTPS (Service tenantry-operator-metrics:8443).
metrics:
  enabled: true
