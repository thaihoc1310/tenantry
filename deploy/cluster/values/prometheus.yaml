# A light Prometheus for the lab (IMPLEMENTATION-PLAN M12 item 1): the server
# on the system pool, 24h in memory-backed emptyDir, scraping Tenantry's own
# components, plus a narrow kube-state-metrics. No Alertmanager, node exporter
# or Pushgateway: the lab has 3 CPU per node.
alertmanager: {enabled: false}
prometheus-node-exporter: {enabled: false}
prometheus-pushgateway: {enabled: false}

restricted: &restricted
  allowPrivilegeEscalation: false
  capabilities: {drop: [ALL]}
  seccompProfile: {type: RuntimeDefault}

# kube-state-metrics for what no Tenantry component reports: the CPU the
# Pods running on a shared pool's nodes request (next to the pool's
# allocatable, ADR-0017) and Pods the scheduler cannot place. Pods, nodes and
# Namespaces only, a short list of metrics, and the two labels the dashboard
# joins on: a node's pool and a Namespace's Tenant (the Workspace).
kube-state-metrics:
  enabled: true
  collectors: [pods, nodes, namespaces]
  metricAllowlist:
    - kube_pod_container_resource_requests
    - kube_pod_status_phase
    - kube_pod_status_unschedulable
    - kube_node_labels
    - kube_node_status_allocatable
    - kube_namespace_labels
  metricLabelsAllowlist:
    - nodes=[tenantry.io/compute-pool]
    - namespaces=[capsule.clastix.io/tenant]
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}
  containerSecurityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities: {drop: [ALL]}
    seccompProfile: {type: RuntimeDefault}
  nodeSelector:
    tenantry.io/compute-pool: system
  tolerations:
    - key: tenantry.io/compute-pool
      operator: Equal
      value: system
      effect: NoSchedule

configmapReload:
  prometheus:
    containerSecurityContext: *restricted
    resources:
      requests: {cpu: 5m, memory: 16Mi}
      limits: {memory: 32Mi}

server:
  retention: 24h
  persistentVolume: {enabled: false}
  emptyDir: {sizeLimit: 2Gi}
  global:
    scrape_interval: 60s
    evaluation_interval: 60s
  containerSecurityContext: *restricted
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 512Mi}
  nodeSelector: &system
    tenantry.io/compute-pool: system
  tolerations: &tolerate-system
    - key: tenantry.io/compute-pool
      operator: Equal
      value: system
      effect: NoSchedule

# The chart's own scrape jobs (the whole cluster's Pods, nodes, cAdvisor...)
# are off: only the jobs below, plus Prometheus itself.
scrapeConfigs:
  kubernetes-api-servers: {enabled: false}
  kubernetes-nodes: {enabled: false}
  kubernetes-nodes-cadvisor: {enabled: false}
  kubernetes-service-endpoints: {enabled: false}
  kubernetes-service-endpoints-slow: {enabled: false}
  prometheus-pushgateway: {enabled: false}
  kubernetes-services: {enabled: false}
  kubernetes-pods: {enabled: false}
  kubernetes-pods-slow: {enabled: false}

# The chart's ClusterRole already allows nonResourceURLs /metrics (get), which
# scraping kube-apiserver needs. The operator's metrics need more: the
# ServiceAccount prometheus-server is bound to tenantry-operator-metrics-reader
# by 90-observability.sh.
serverFiles:
  prometheus.yml:
    scrape_configs:
      - job_name: tenantry-operator
        scheme: https
        tls_config: {insecure_skip_verify: true}   # the operator's self-signed serving certificate
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        static_configs:
          - targets: [tenantry-operator-metrics.tenantry-operator.svc:8443]
      - job_name: capsule
        static_configs:
          - targets: [capsule-controller-manager-metrics-service.capsule-system.svc:8080]
      - job_name: capsule-proxy
        static_configs:
          - targets: [capsule-proxy-metrics-service.capsule-system.svc:8080]
      # Only the request counters and latency of kube-apiserver: its full
      # /metrics has tens of thousands of series.
      - job_name: kube-apiserver
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        static_configs:
          - targets: [kubernetes.default.svc:443]
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: apiserver_request_total|apiserver_request_duration_seconds_(bucket|sum|count)
            action: keep
      - job_name: kube-state-metrics
        static_configs:
          - targets: [prometheus-kube-state-metrics.observability.svc:8080]
      # The backend's API and workers (plain HTTP on port 9090).
      - job_name: tenantry-backend
        static_configs:
          - targets:
              - tenantry-api-metrics.tenantry-system.svc:9090
              - tenantry-worker-provisioning-metrics.tenantry-system.svc:9090
              - tenantry-worker-groupsync-metrics.tenantry-system.svc:9090
