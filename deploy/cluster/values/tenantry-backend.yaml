# tenantry-backend on this cluster (make deploy). The image is not in a
# registry yet: it is loaded into each node's containerd by hand (README).
database:
  existingSecret: tenantry-db # written by 50-postgres.sh

# issuer and publicURL come from env.sh (deploy.sh passes them).
api:
  auth:
    existingSecret: tenantry-portal # portal client secret + session key, generated on the cluster
  # Traefik runs on Calico's default pool, which only system Pods use: tenant
  # Pods get addresses from their Workspace's NetworkPool, and their egress
  # policy denies 192.168.0.0/16 (architecture/05-network-and-scheduling.md).
  trustedProxies: [192.168.0.0/16]

# Starting data; the endpoints come from env.sh (deploy.sh passes them).
seed:
  enabled: true

# Central plane: the system pool (architecture/05-network-and-scheduling.md §1).
nodeSelector:
  tenantry.io/compute-pool: system
tolerations:
  - key: tenantry.io/compute-pool
    operator: Equal
    value: system
    effect: NoSchedule
