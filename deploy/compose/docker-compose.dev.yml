# Local dev dependencies (IMPLEMENTATION-PLAN §10). Keycloak joins at M3.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tenantry
      POSTGRES_PASSWORD: tenantry
      POSTGRES_DB: tenantry
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenantry"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pgdata: {}
