# The operator's image (deploy/Dockerfile.operator).
image:
  repository: tenantry/operator
  tag: ""            # defaults to the chart appVersion
  pullPolicy: IfNotPresent

# Registries tenants may pull images from (a Capsule rule on the Tenant).
# With docker.io, Docker Hub short names (nginx, bitnami/redis) count too.
allowedRegistries:
  - docker.io
  - ghcr.io
  - quay.io
  - registry.k8s.io

# Log level of the operator: debug, info or error.
logLevel: info

# Where the operator runs. Empty: any node. A cluster with a system pool sets
# its label and taint here.
nodeSelector: {}
tolerations: []

resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { memory: 256Mi }

# Groups that may change node labels and taints under tenantry.io/ and
# workspaces.tenantry.io/ besides the operator (ValidatingAdmissionPolicy
# tenantry-node-labels). Empty: the operator alone. A cluster admin group
# that can delete the policy anyway gains nothing from being refused.
nodeLabelAdmins: []
