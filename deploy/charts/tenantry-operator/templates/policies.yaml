{{- $operator := printf "system:serviceaccount:%s:tenantry-operator" .Release.Namespace }}
# Node labels and taints with keys tenantry.io/* and workspaces.tenantry.io/*
# decide where tenant Pods run: only the operator may change them, and the
# groups in nodeLabelAdmins (architecture/06 §7; RBAC cannot filter label
# keys). Everyone else's change to such a key is refused, other keys are not.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: tenantry-node-labels
  labels:
    {{- include "tenantry.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [nodes]
  matchConditions:
    - name: not-the-operator
      expression: request.userInfo.username != {{ $operator | quote }}
    - name: not-a-node-label-admin
      expression: '!request.userInfo.groups.exists(g, g in {{ .Values.nodeLabelAdmins | toJson }})'
  variables:
    - name: newLabels
      expression: >-
        has(object.metadata.labels) ? object.metadata.labels.filter(k, k.startsWith('tenantry.io/') || k.startsWith('workspaces.tenantry.io/'))
        .map(k, k + '=' + object.metadata.labels[k]) : []
    - name: oldLabels
      expression: >-
        oldObject != null && has(oldObject.metadata.labels) ? oldObject.metadata.labels.filter(k, k.startsWith('tenantry.io/') || k.startsWith('workspaces.tenantry.io/'))
        .map(k, k + '=' + oldObject.metadata.labels[k]) : []
    - name: newTaints
      expression: >-
        has(object.spec.taints) ? object.spec.taints.filter(t, t.key.startsWith('tenantry.io/') || t.key.startsWith('workspaces.tenantry.io/'))
        .map(t, t.key + '=' + (has(t.value) ? t.value : '') + ':' + t.effect) : []
    - name: oldTaints
      expression: >-
        oldObject != null && has(oldObject.spec.taints) ? oldObject.spec.taints.filter(t, t.key.startsWith('tenantry.io/') || t.key.startsWith('workspaces.tenantry.io/'))
        .map(t, t.key + '=' + (has(t.value) ? t.value : '') + ':' + t.effect) : []
  validations:
    - expression: >-
        variables.newLabels.all(l, l in variables.oldLabels) && variables.oldLabels.all(l, l in variables.newLabels) &&
        variables.newTaints.all(t, t in variables.oldTaints) && variables.oldTaints.all(t, t in variables.newTaints)
      reason: Forbidden
      message: only the Tenantry operator may change node labels and taints under tenantry.io/ and workspaces.tenantry.io/
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: tenantry-node-labels
  labels:
    {{- include "tenantry.labels" . | nindent 4 }}
spec:
  policyName: tenantry-node-labels
  validationActions: [Deny]
---
# A tenant may not pick a node by name (architecture/05 §2). Hardening only:
# kubelet already refuses a Pod whose node does not match its Namespace's
# node selector; this says why at once. Only tenant callers (oidc:) are
# checked: controllers create Pods from these templates with their own
# identity, so the templates are checked too.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: tenantry-tenant-node-name
  labels:
    {{- include "tenantry.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments, statefulsets, daemonsets, replicasets]
      - apiGroups: [batch]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [jobs, cronjobs]
  matchConditions:
    - name: tenant-caller
      expression: request.userInfo.username.startsWith('oidc:')
  variables:
    - name: podSpec
      expression: >-
        request.kind.kind == 'Pod' ? object.spec :
        request.kind.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.spec : object.spec.template.spec
  validations:
    - expression: '!has(variables.podSpec.nodeName) || variables.podSpec.nodeName == ""'
      reason: Forbidden
      message: spec.nodeName is not allowed in a Workspace; the Workspace's node selector places Pods
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: tenantry-tenant-node-name
  labels:
    {{- include "tenantry.labels" . | nindent 4 }}
spec:
  policyName: tenantry-tenant-node-name
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - {key: capsule.clastix.io/tenant, operator: Exists}
---
# A tenant may not pick its Pods' addresses (architecture/05 §5): Calico
# prefers a Pod's annotations to its Namespace's, and a Manual pool gives
# addresses to whoever names it. Only tenant callers (oidc:) are checked;
# the templates of workload controllers are checked too, like nodeName.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: tenantry-tenant-pod-network
  labels:
    {{- include "tenantry.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments, statefulsets, daemonsets, replicasets]
      - apiGroups: [batch]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [jobs, cronjobs]
  matchConditions:
    - name: tenant-caller
      expression: request.userInfo.username.startsWith('oidc:')
  variables:
    - name: pod
      expression: >-
        request.kind.kind == 'Pod' ? object :
        request.kind.kind == 'CronJob' ? object.spec.jobTemplate.spec.template : object.spec.template
  validations:
    - expression: >-
        !has(variables.pod.metadata) || !has(variables.pod.metadata.annotations) ||
        !variables.pod.metadata.annotations.exists(k, k in [
        'cni.projectcalico.org/ipv4pools', 'cni.projectcalico.org/ipv6pools', 'cni.projectcalico.org/ipAddrs',
        'cni.projectcalico.org/ipAddrsNoIpam', 'cni.projectcalico.org/floatingIPs'])
      reason: Forbidden
      message: >-
        Calico annotations (ipv4pools, ipv6pools, ipAddrs, ipAddrsNoIpam, floatingIPs) are not allowed on Pods
        in a Workspace; Pods take addresses from the Workspace's network
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: tenantry-tenant-pod-network
  labels:
    {{- include "tenantry.labels" . | nindent 4 }}
spec:
  policyName: tenantry-tenant-pod-network
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - {key: capsule.clastix.io/tenant, operator: Exists}
---
# A Workspace's Namespace runs no Pod before its baseline NetworkPolicies
# are there (architecture/05 §6): Capsule replicates them a few seconds
# after a kubectl-made Namespace appears. tenant-default-deny is the
# parameter, looked up in the Namespace of the request; none means refused.
# Every caller is checked, the ReplicaSet controller too: it retries.
# Only Namespaces of a Workspace with a network get the policies, so only
# those are checked: the binding selects the label tenantry.io/network,
# which Capsule keeps on them. Not a matchCondition: the API server looks
# the parameter up before it evaluates matchConditions, so a missing
# parameter would refuse Pods in every tenant Namespace. With no parameter
# the API server answers 422 with its own message ("no params found for
# policy binding with Deny parameterNotFoundAction"); validations never run.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: tenantry-tenant-network-ready
  labels:
    {{- include "tenantry.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
  validations:
    - expression: 'true'
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: tenantry-tenant-network-ready
  labels:
    {{- include "tenantry.labels" . | nindent 4 }}
spec:
  policyName: tenantry-tenant-network-ready
  validationActions: [Deny]
  paramRef:
    name: tenant-default-deny
    parameterNotFoundAction: Deny
  matchResources:
    namespaceSelector:
      matchExpressions:
        - {key: capsule.clastix.io/tenant, operator: Exists}
        - {key: tenantry.io/network, operator: In, values: ["true"]}
---
# Routes are the only way in (PRODUCT-PLAN §7.6, architecture/05 §7): a
# tenant writes no Ingress, no cert-manager object (it could get a
# certificate for someone else's host through the ClusterIssuer), no Gateway
# API or Traefik object. Capsule's admin role and cert-manager's aggregation
# give Workspace owners those rights, hence the policy. Only tenant callers
# (oidc:) are refused, never "everyone but X": the operator writes the
# Ingresses, and the namespace controller and garbage collector must delete
# them with their Namespace.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: tenantry-tenant-ingress-lockdown
  labels:
    {{- include "tenantry.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [networking.k8s.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [ingresses]
      - apiGroups: [cert-manager.io, acme.cert-manager.io, gateway.networking.k8s.io, traefik.io, traefik.containo.us]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: ["*"]
  matchConditions:
    - name: tenant-caller
      expression: request.userInfo.username.startsWith('oidc:')
  validations:
    - expression: 'false'
      reason: Forbidden
      messageExpression: >-
        request.resource.resource + ' cannot be written in a Workspace; a Route on the portal publishes an app'
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: tenantry-tenant-ingress-lockdown
  labels:
    {{- include "tenantry.labels" . | nindent 4 }}
spec:
  policyName: tenantry-tenant-ingress-lockdown
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - {key: capsule.clastix.io/tenant, operator: Exists}
---
# A Workspace owner binds only their own Organization's groups and the
# Workspace's ServiceAccounts (architecture/05 §7, 06 §5): revoking a member
# from a group then revokes their Kubernetes rights. The Organization is the
# Namespace's tenantry.io/org label, the Tenant its capsule.clastix.io/tenant
# label; Capsule keeps both. Users, other Organizations' groups and the group
# of every tenant user (oidc:tenantry:tenant-users) are refused. Only tenant
# callers (oidc:) are checked: Capsule's additionalRoleBindings come from
# Capsule.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: tenantry-tenant-rolebinding-subjects
  labels:
    {{- include "tenantry.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [rbac.authorization.k8s.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [rolebindings]
  matchConditions:
    - name: tenant-caller
      expression: request.userInfo.username.startsWith('oidc:')
  variables:
    - name: labels
      expression: 'has(namespaceObject.metadata.labels) ? namespaceObject.metadata.labels : {}'
    - name: groupPrefix
      expression: "'tenantry.io/org' in variables.labels ? 'oidc:org_' + variables.labels['tenantry.io/org'] + ':' : ''"
    - name: saPrefix
      expression: "'capsule.clastix.io/tenant' in variables.labels ? variables.labels['capsule.clastix.io/tenant'] + '-' : ''"
  validations:
    - expression: >-
        variables.groupPrefix != '' && variables.saPrefix != '' &&
        (!has(object.subjects) || object.subjects.all(s,
          (s.kind == 'Group' && s.name.startsWith(variables.groupPrefix)) ||
          (s.kind == 'ServiceAccount' && s.?namespace.orValue('').startsWith(variables.saPrefix))))
      reason: Forbidden
      messageExpression: >-
        'RoleBinding subjects in a Workspace must be groups of its Organization (' + variables.groupPrefix +
        '...) or ServiceAccounts of its Namespaces (' + variables.saPrefix + '...)'
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: tenantry-tenant-rolebinding-subjects
  labels:
    {{- include "tenantry.labels" . | nindent 4 }}
spec:
  policyName: tenantry-tenant-rolebinding-subjects
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - {key: capsule.clastix.io/tenant, operator: Exists}
