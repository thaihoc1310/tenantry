# Who may read the operator's metrics: bind a scraper to this ClusterRole.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tenantry-operator-metrics-reader
  labels:
    {{- include "tenantry.labels" . | nindent 4 }}
rules:
  - nonResourceURLs: [/metrics]
    verbs: [get]
{{- if .Values.metrics.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: tenantry-operator-metrics
  labels:
    {{- include "tenantry.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: operator
  ports:
    - name: metrics
      port: 8443
      targetPort: metrics
{{- end }}
