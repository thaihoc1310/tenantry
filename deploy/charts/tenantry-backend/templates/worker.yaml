# Delivers outbox events to this cluster, copies the CRs' status back and
# deletes expired rows (IMPLEMENTATION-PLAN §5.3). Its ServiceAccount may
# touch the four tenantry.io CRs and nothing else (architecture/06 §7); the
# CRDs themselves come with the tenantry-operator chart. The group sync loop
# runs in a second Deployment with its own credentials, below.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tenantry-worker-provisioning
  labels:
    {{- include "tenantry.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tenantry-worker-provisioning
  labels:
    {{- include "tenantry.labels" . | nindent 4 }}
rules:
  # Not */status: the controller reports, the worker only reads.
  - apiGroups: [tenantry.io]
    resources: [platformworkspaces, platformnodegrants, platformsharedpools]
    verbs: [get, list, watch, create, patch, delete]
  # The one object the operator chart creates.
  - apiGroups: [tenantry.io]
    resources: [platformnodeinventories]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tenantry-worker-provisioning
  labels:
    {{- include "tenantry.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tenantry-worker-provisioning
subjects:
  - kind: ServiceAccount
    name: tenantry-worker-provisioning
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenantry-worker-provisioning
  labels:
    {{- include "tenantry.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker-provisioning
spec:
  replicas: {{ .Values.worker.provisioning.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker-provisioning
  template:
    metadata:
      labels:
        {{- include "tenantry.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker-provisioning
    spec:
      serviceAccountName: tenantry-worker-provisioning
      automountServiceAccountToken: true
      # On SIGTERM the worker finishes the batch in hand, for up to 2 minutes
      # (outbox.batchTimeout); killing it earlier only means redelivery.
      terminationGracePeriodSeconds: 150
      {{- with include "tenantry.scheduling" . | trim }}{{ . | nindent 6 }}{{ end }}
      securityContext:
        {{- include "tenantry.podSecurity" . | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "tenantry.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [/usr/local/bin/tenantry-worker]
          args: [--loops=provisioning,housekeeping]
          env:
            {{- include "tenantry.env" . | nindent 12 }}
            - name: TENANTRY_CLUSTER_ID
              value: {{ required "worker.provisioning.clusterId or seed.clusterId is required" (.Values.worker.provisioning.clusterId | default .Values.seed.clusterId) | quote }}
            - name: TENANTRY_OPERATION_TIMEOUT
              value: {{ .Values.worker.provisioning.operationTimeout | quote }}
          resources:
            {{- toYaml .Values.worker.provisioning.resources | nindent 12 }}
          securityContext:
            {{- include "tenantry.containerSecurity" . | nindent 12 }}
{{- if .Values.worker.groupsync.enabled }}
{{- $kc := .Values.worker.groupsync.keycloak }}
---
# Mirrors organization groups to Keycloak (IMPLEMENTATION-PLAN §5.2). The only
# Pod that gets tenantry-sync's client secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenantry-worker-groupsync
  labels:
    {{- include "tenantry.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker-groupsync
spec:
  replicas: {{ .Values.worker.groupsync.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker-groupsync
  template:
    metadata:
      labels:
        {{- include "tenantry.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker-groupsync
    spec:
      # Calls Keycloak, never Kubernetes.
      automountServiceAccountToken: false
      # On SIGTERM the worker finishes the batch in hand, for up to 2 minutes.
      terminationGracePeriodSeconds: 150
      {{- with include "tenantry.scheduling" . | trim }}{{ . | nindent 6 }}{{ end }}
      securityContext:
        {{- include "tenantry.podSecurity" . | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "tenantry.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [/usr/local/bin/tenantry-worker]
          args: [--loops=groupsync]
          env:
            {{- include "tenantry.env" . | nindent 12 }}
            - name: TENANTRY_KEYCLOAK_URL
              value: {{ required "worker.groupsync.keycloak.url is required" $kc.url | quote }}
            - name: TENANTRY_KEYCLOAK_REALM
              value: {{ $kc.realm | quote }}
            - name: TENANTRY_KEYCLOAK_CLIENT_ID
              value: {{ $kc.clientID | quote }}
            - name: TENANTRY_KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "worker.groupsync.keycloak.existingSecret is required" $kc.existingSecret }}
                  key: {{ $kc.clientSecretKey }}
          resources:
            {{- toYaml .Values.worker.groupsync.resources | nindent 12 }}
          securityContext:
            {{- include "tenantry.containerSecurity" . | nindent 12 }}
{{- end }}
