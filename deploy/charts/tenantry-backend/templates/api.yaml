apiVersion: v1
kind: Service
metadata:
  name: tenantry-api
  labels:
    {{- include "tenantry.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenantry-api
  labels:
    {{- include "tenantry.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "tenantry.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      # The API never calls Kubernetes.
      automountServiceAccountToken: false
      # Above the API's own 15 s graceful shutdown.
      terminationGracePeriodSeconds: 30
      {{- with include "tenantry.scheduling" . | trim }}{{ . | nindent 6 }}{{ end }}
      securityContext:
        {{- include "tenantry.podSecurity" . | nindent 8 }}
      containers:
        - name: api
          image: {{ include "tenantry.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [/usr/local/bin/tenantry-api]
          env:
            {{- include "tenantry.env" . | nindent 12 }}
            - name: TENANTRY_ADDR
              value: ":8080"
            - name: TENANTRY_AUTH_DEV_HEADER
              value: {{ .Values.api.devAuth | quote }}
          ports:
            - name: http
              containerPort: 8080
          # Liveness never touches the database: a PostgreSQL outage must not
          # restart every API pod. Readiness takes the pod out of the Service instead.
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- include "tenantry.containerSecurity" . | nindent 12 }}
