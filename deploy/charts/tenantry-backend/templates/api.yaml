apiVersion: v1
kind: Service
metadata:
  name: tenantry-api
  labels:
    {{- include "tenantry.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenantry-api
  labels:
    {{- include "tenantry.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "tenantry.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      # The API never calls Kubernetes.
      automountServiceAccountToken: false
      # Above the API's own 15 s graceful shutdown.
      terminationGracePeriodSeconds: 30
      {{- with include "tenantry.scheduling" . | trim }}{{ . | nindent 6 }}{{ end }}
      securityContext:
        {{- include "tenantry.podSecurity" . | nindent 8 }}
      containers:
        - name: api
          image: {{ include "tenantry.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [/usr/local/bin/tenantry-api]
          env:
            {{- include "tenantry.env" . | nindent 12 }}
            - name: TENANTRY_ADDR
              value: ":8080"
            {{- with .Values.api.trustedProxies }}
            - name: TENANTRY_TRUSTED_PROXIES
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.api.auth }}
            - name: TENANTRY_OIDC_ISSUER
              value: {{ required "api.auth.issuer is required" .issuer | quote }}
            - name: TENANTRY_PUBLIC_URL
              value: {{ required "api.auth.publicURL is required" .publicURL | quote }}
            - name: TENANTRY_OIDC_CLIENT_ID
              value: {{ .clientID | quote }}
            - name: TENANTRY_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "api.auth.existingSecret is required" .existingSecret }}
                  key: {{ .clientSecretKey }}
            - name: TENANTRY_SESSION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .existingSecret }}
                  key: {{ .sessionKeyKey }}
            {{- end }}
            - name: TENANTRY_METRICS_ADDR
              value: {{ include "tenantry.metricsAddr" . | quote }}
          ports:
            - name: http
              containerPort: 8080
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
            {{- end }}
          # Liveness never touches the database: a PostgreSQL outage must not
          # restart every API pod. Readiness takes the pod out of the Service instead.
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- include "tenantry.containerSecurity" . | nindent 12 }}
