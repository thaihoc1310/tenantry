# One image holds every backend binary (deploy/Dockerfile.backend).
image:
  repository: tenantry/backend
  tag: ""            # defaults to the chart appVersion
  pullPolicy: IfNotPresent

# The chart never creates or holds database credentials: point it at a Secret
# that already exists in the release namespace.
database:
  existingSecret: ""   # required
  key: DATABASE_URL    # key holding the postgres:// URL

log:
  level: info          # debug, info, warn, error

# Where every Pod of the chart runs (api, workers, migrate Job). Empty: any
# node. A cluster with a system pool sets its label and taint here.
nodeSelector: {}
tolerations: []

api:
  # One replica: rate limits are counted in memory per replica
  # (architecture/06-security-and-identity.md §6).
  replicas: 1
  # CIDRs of the proxies in front of the API (Traefik). Their
  # X-Forwarded-For names the client for rate limiting by IP; from anyone
  # else the header is ignored. Empty: the connecting address counts.
  trustedProxies: []
  # Login through Keycloak (architecture/06-security-and-identity.md §3).
  auth:
    issuer: ""           # required, e.g. https://auth.example.com/realms/tenantry
    publicURL: ""        # required: the portal origin browsers use, e.g. https://portal.example.com
    clientID: portal
    # Secret in the release namespace with the portal client's secret and the
    # session encryption key (32 random bytes, base64). Like the database
    # credentials, the chart never creates or holds it.
    existingSecret: ""   # required
    clientSecretKey: client-secret
    sessionKeyKey: session-key
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }

worker:
  provisioning:
    replicas: 1        # more are safe (SKIP LOCKED) but not needed
    # The cluster this chart runs on, as registered (its events only are
    # delivered here); its ServiceAccount may touch the tenantry.io CRs only.
    clusterId: ""      # default: seed.clusterId
    operationTimeout: 10m  # a delivered operation not Ready by then is Failed
    resources:
      requests: { cpu: 20m, memory: 64Mi }
      limits: { memory: 256Mi }
  # Mirrors organization groups to Keycloak as the service account of the
  # client tenantry-sync (IMPLEMENTATION-PLAN §5.2). Its own Deployment: the
  # only Pod given that client's secret, which can manage every user.
  groupsync:
    enabled: true
    replicas: 1        # more are safe (SKIP LOCKED) but not needed
    keycloak:
      url: ""          # required: Keycloak's base URL, e.g. http://keycloak-http.keycloak.svc
      realm: tenantry
      clientID: tenantry-sync
      # Secret in the release namespace holding only the client secret. Like
      # the database credentials, the chart never creates or holds it.
      existingSecret: tenantry-keycloak-sync
      clientSecretKey: client-secret
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 128Mi }

migrate:
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 128Mi }

# Starting data (cmd/tenantry-seed): the cluster this chart runs on, its
# shared pool, the shared network pool and the onboarding policy.
seed:
  enabled: false
  clusterId: cluster-a
  clusterName: Cluster A
  proxyEndpoint: ""   # Capsule Proxy URL, the server in tenant kubeconfigs
  consoleURL: ""      # Headlamp
  appsDomain: ""      # tenant Routes: <name>-<workspace>.<appsDomain>
  networkCIDR: 10.240.0.0/18
  storageClass: standard
  # Ranges the cluster already uses, which network pools may not overlap:
  # the Pod CIDR (Calico's default pool) and the Service CIDR.
  reservedCidrs: []
  # The cluster's nodes, written once (from M6 the operator reports them),
  # each as name=,kind=ControlPlane|System|Worker,cpu=,memory=,pods=,
  # ready=,schedulable=,pool= (deploy/cluster/deploy.sh reads them from the
  # cluster).
  nodes: []

# /metrics of the API and the workers, on a port of their own (PRODUCT-PLAN
# §21.2), behind the Services tenantry-<component>-metrics.
metrics:
  enabled: true
  port: 9090
