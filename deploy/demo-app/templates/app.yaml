apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  labels:
    {{- include "demo-app.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.storage.className }}
  resources:
    requests:
      storage: {{ .Values.storage.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "demo-app.labels" . | nindent 4 }}
spec:
  replicas: 1
  # One writer on a ReadWriteOnce volume: stop the old Pod before the new one.
  strategy: {type: Recreate}
  selector:
    matchLabels:
      {{- include "demo-app.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "demo-app.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      # Each start adds a line to a page on the volume: after a restart the
      # earlier lines are still there.
      initContainers:
        - name: write-page
          image: {{ .Values.initImage.repository }}:{{ .Values.initImage.tag }}
          command:
            - sh
            - -c
            - |
              f=/data/index.html
              [ -f "$f" ] || printf '<h1>%s</h1>\n<p>Starts of this app, kept on its volume:</p>\n' "$MESSAGE" > "$f"
              printf '<p>%s on %s</p>\n' "$(date -u '+%Y-%m-%d %H:%M:%S UTC')" "$HOSTNAME" >> "$f"
          env:
            - {name: MESSAGE, value: {{ .Values.message | quote }}}
          volumeMounts: [{name: data, mountPath: /data}]
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
      containers:
        - name: web
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          ports: [{name: http, containerPort: 8080}]
          volumeMounts: [{name: data, mountPath: /usr/share/nginx/html, readOnly: true}]
          readinessProbe:
            httpGet: {path: /, port: http}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "demo-app.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "demo-app.labels" . | nindent 4 }}
  ports:
    - {name: http, port: {{ .Values.service.port }}, targetPort: http}
