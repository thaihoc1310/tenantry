apiVersion: capsule.clastix.io/v1beta2
kind: Tenant
metadata:
  labels:
    tenantry.io/cluster-id: cluster-a
    tenantry.io/compute-mode: dedicated
    tenantry.io/managed: "true"
    tenantry.io/organization-id: org-01jabc
    tenantry.io/workspace-id: ws-01jwat
  name: acme-water
spec:
  additionalRoleBindings:
  - clusterRoleName: tenantry:tenant-developer
    subjects:
    - apiGroup: rbac.authorization.k8s.io
      kind: Group
      name: oidc:org_01jabc:group_01jdev
  - clusterRoleName: tenantry:tenant-viewer
    subjects:
    - apiGroup: rbac.authorization.k8s.io
      kind: Group
      name: oidc:org_01jabc:group_01jview
  cordoned: false
  forceTenantPrefix: true
  namespaceOptions:
    quota: 3
  nodeSelector:
    workspaces.tenantry.io/ws-01jwat: "true"
  owners:
  - kind: Group
    name: oidc:org_01jabc:group_01jadmin
  - kind: Group
    name: oidc:org_01jabc:group_01jops
  - kind: ServiceAccount
    name: system:serviceaccount:tenantry-operator:tenantry-operator
  rules:
  - enforce:
      action: allow
      metadata:
      - annotations:
          scheduler.alpha.kubernetes.io/defaultTolerations:
            managed: '[{"key":"tenantry.io/dedicated-org","operator":"Equal","value":"org-01jabc","effect":"NoSchedule"}]'
          scheduler.alpha.kubernetes.io/node-selector:
            managed: workspaces.tenantry.io/ws-01jwat=true
          scheduler.alpha.kubernetes.io/tolerationsWhitelist:
            managed: '[{"key":"tenantry.io/dedicated-org","operator":"Equal","value":"org-01jabc","effect":"NoSchedule"},{"key":"node.kubernetes.io/not-ready","operator":"Exists"},{"key":"node.kubernetes.io/unreachable","operator":"Exists"},{"key":"node.kubernetes.io/disk-pressure","operator":"Exists"},{"key":"node.kubernetes.io/memory-pressure","operator":"Exists"},{"key":"node.kubernetes.io/pid-pressure","operator":"Exists"},{"key":"node.kubernetes.io/network-unavailable","operator":"Exists"},{"key":"node.kubernetes.io/unschedulable","operator":"Exists"}]'
        apiGroups:
        - v1
        kinds:
        - Namespace
        labels:
          pod-security.kubernetes.io/audit:
            managed: restricted
          pod-security.kubernetes.io/enforce:
            managed: baseline
          pod-security.kubernetes.io/warn:
            managed: restricted
          tenantry.io/cluster-id:
            managed: cluster-a
          tenantry.io/compute-mode:
            managed: dedicated
          tenantry.io/managed:
            managed: "true"
          tenantry.io/org:
            managed: 01jabc
          tenantry.io/organization-id:
            managed: org-01jabc
          tenantry.io/workspace-id:
            managed: ws-01jwat
  - enforce:
      action: deny
      metadata:
      - annotations:
          cni.projectcalico.org/ipv4pools:
            values:
            - exp: .*
          cni.projectcalico.org/ipv6pools:
            values:
            - exp: .*
        apiGroups:
        - v1
        kinds:
        - Namespace
  - enforce:
      action: allow
      workloads:
        registries:
        - exp: ^(docker\.io|ghcr\.io)/.+
        - exp: ^[^/]+$
        - exp: ^[^./:]+/[^/]+$
  - enforce:
      action: deny
      workloads:
        qosClasses:
        - BestEffort
  - enforce:
      action: deny
      services:
        types:
        - NodePort
        - LoadBalancer
        - ExternalName
  - quota:
    - hard:
        requests.cpu: "2"
      name: workspace
  storageClasses:
    allowed:
    - standard
