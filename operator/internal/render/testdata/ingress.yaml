apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  labels:
    tenantry.io/cluster-id: cluster-a
    tenantry.io/compute-mode: shared
    tenantry.io/compute-pool: shared-general
    tenantry.io/managed: "true"
    tenantry.io/organization-id: org-01jabc
    tenantry.io/route: web
    tenantry.io/workspace-id: ws-01jsol
  name: web
  namespace: acme-solar-frontend
spec:
  ingressClassName: platform-shared
  rules:
  - host: web-acme-solar.mvp.tenantry.site
    http:
      paths:
      - backend:
          service:
            name: web
            port:
              number: 80
        path: /
        pathType: Prefix
