openapi: 3.0.3
info:
  title: Tenantry Platform API
  version: 1.0.0-alpha.1
  description: |
    Contract between the portal and the Platform API (PRODUCT-PLAN §16).
    Only implemented endpoints are listed; paths are added as they are built.
    Request bodies are validated against this file before reaching a handler.
    Every error body is `ErrorResponse` with a stable `code`.

    Signing in happens outside this API, by browser navigation:
    `GET /auth/login?returnTo=/some/path` sends the browser to Keycloak and
    `GET /auth/callback` brings it back with the session and CSRF cookies set.
    A `401` on any call means: navigate to `/auth/login`.
    `POST /auth/logout` (with the CSRF header) answers `204`, deletes both
    cookies and ends the Keycloak SSO session too, so Headlamp and kubectl
    ask for a new login as well.
servers:
  - url: /api/v1

security:
  - session: []

paths:
  /me:
    get:
      operationId: getMe
      summary: The signed-in user
      description: |
        Who the portal is talking to and whether to show the Admin area. The
        caller's organizations come from `GET /organizations`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Error" }

  /organizations:
    get:
      operationId: listOrganizations
      summary: Organizations the caller belongs to, including their own Pending and Rejected requests
      description: Newest first. Deleted organizations are not returned.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          description: Opaque; pass `nextCursor` from the previous page.
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationList" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: createOrganization
      security: [{ session: [], csrf: [] }]
      summary: Request a new organization (PRODUCT-PLAN §4.2)
      description: |
        Creates the organization as `Pending` with the caller as OrgOwner; a
        Platform Admin approves or rejects it. Values are trimmed.
        `slug` is permanent and prefixes every Kubernetes name the
        organization will own (`<org>-<workspace>`): lowercase letters and
        digits only, no hyphen, so that name points at one Workspace of one
        organization. Reserved words are refused.
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationCreate" }
      responses:
        "201":
          description: Created
          headers:
            Location:
              description: URL of the new organization
              required: true
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409":
          description: |
            `SLUG_TAKEN`: another organization holds the slug (a rejected
            request releases it, a deleted organization does not).
            `ORG_REQUEST_PENDING`: the caller already has a request waiting for review.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422": { $ref: "#/components/responses/IdempotencyKeyReused" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /organizations/{orgId}:
    parameters:
      - $ref: "#/components/parameters/orgId"
    get:
      operationId: getOrganization
      summary: Organization detail (any member)
      description: A non-member gets 404, so ids and slugs cannot be probed.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: patchOrganization
      security: [{ session: [], csrf: [] }]
      summary: Update display name or description (OrgOwner or OrgAdmin). Slug is immutable.
      description: |
        Fields left out keep their value; an empty body changes nothing.
        Values are trimmed; a blank displayName is rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationPatch" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: The organization request was rejected and is read-only (`CONFLICT`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      operationId: deleteOrganization
      security: [{ session: [], csrf: [] }]
      summary: Delete the organization (OrgOwner)
      description: |
        Only with no Workspace left (deleting one finishes when its cluster
        is clean) and no dedicated node (a Platform Admin takes them back).
        Its grants go, open invitations and transfers end, and its groups
        leave Keycloak; it is 404 everywhere after (04-state-machines §11).
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: |
            `ORG_NOT_ACTIVE`: a request not approved is not deleted this way.
            `ORGANIZATION_NOT_EMPTY`: Workspaces or dedicated nodes left (`details.workspaces`, `details.dedicatedNodes`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /organizations/{orgId}/entitlement:
    parameters:
      - $ref: "#/components/parameters/orgId"
    get:
      operationId: getEntitlement
      summary: What the organization was granted (OrgOwner or OrgAdmin)
      description: |
        The global entitlement and every cluster grant, the default first
        (PRODUCT-PLAN §5.6). Checked in this order: a non-member gets 404,
        an OrgMember 403, an organization not yet approved 409 `ORG_NOT_ACTIVE`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationEntitlement" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/OrgNotActive" }

  /organizations/{orgId}/usage:
    parameters:
      - $ref: "#/components/parameters/orgId"
    get:
      operationId: getUsage
      summary: What the organization uses, next to its limits (OrgOwner or OrgAdmin)
      description: |
        Two parts (PRODUCT-PLAN §5.6), each number with its limit so a quota
        bar needs this response only. Organization-wide counts are real (an
        organization just approved has 1 member and 3 groups); per grant,
        what its Workspaces hold, zero until Workspaces exist. Same checks
        as `getEntitlement`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationUsage" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/OrgNotActive" }

  /organizations/{orgId}/clusters:
    parameters:
      - $ref: "#/components/parameters/orgId"
    get:
      operationId: listOrgClusters
      summary: The clusters the organization is granted, the default first (OrgOwner or OrgAdmin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgClusterList" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: The organization is not Active (`ORG_NOT_ACTIVE`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /organizations/{orgId}/clusters/{clusterId}:
    parameters:
      - $ref: "#/components/parameters/orgId"
      - $ref: "#/components/parameters/clusterId"
    get:
      operationId: getOrgCluster
      summary: One cluster the organization is granted (OrgOwner or OrgAdmin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgCluster" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: The organization is not Active (`ORG_NOT_ACTIVE`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /organizations/{orgId}/clusters/{clusterId}/compute-options:
    parameters:
      - $ref: "#/components/parameters/orgId"
      - $ref: "#/components/parameters/clusterId"
    get:
      operationId: getComputeOptions
      summary: Which compute modes the organization can use on a cluster, and why not (OrgOwner or OrgAdmin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComputeOptions" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: The organization is not Active (`ORG_NOT_ACTIVE`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /organizations/{orgId}/clusters/{clusterId}/shared-pools:
    parameters:
      - $ref: "#/components/parameters/orgId"
      - $ref: "#/components/parameters/clusterId"
    get:
      operationId: listOrgSharedPools
      summary: The shared pools of the organization's grant on a cluster, as a summary (OrgOwner or OrgAdmin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgSharedPoolList" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: The organization is not Active (`ORG_NOT_ACTIVE`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /organizations/{orgId}/clusters/{clusterId}/dedicated-nodes:
    parameters:
      - $ref: "#/components/parameters/orgId"
      - $ref: "#/components/parameters/clusterId"
    get:
      operationId: listOrgDedicatedNodes
      summary: The nodes dedicated to the organization on a cluster, with their capacity (OrgOwner or OrgAdmin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgDedicatedNodeList" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: The organization is not Active (`ORG_NOT_ACTIVE`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /organizations/{orgId}/clusters/{clusterId}/network-pools:
    parameters:
      - $ref: "#/components/parameters/orgId"
      - $ref: "#/components/parameters/clusterId"
    get:
      operationId: listOrgNetworkPools
      summary: The network pools of the organization's grant on a cluster (OrgOwner or OrgAdmin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgNetworkPoolList" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: The organization is not Active (`ORG_NOT_ACTIVE`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /organizations/{orgId}/network-pools/{poolId}/availability:
    parameters:
      - $ref: "#/components/parameters/orgId"
      - $ref: "#/components/parameters/poolId"
    get:
      operationId: getNetworkPoolAvailability
      summary: What is left in a network pool of the organization's grants, and its own blocks (OrgOwner or OrgAdmin)
      description: |
        Free blocks are counted at each allowed prefix length; the blocks of
        other organizations are never shown, only that they are taken
        (architecture/04 §4).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NetworkPoolAvailability" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: The organization is not Active (`ORG_NOT_ACTIVE`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /organizations/{orgId}/invitations:
    parameters:
      - $ref: "#/components/parameters/orgId"
    get:
      operationId: listInvitations
      summary: Open invitations of the organization, newest first (OrgOwner or OrgAdmin)
      description: |
        Invitations not yet accepted or revoked; one whose link expired shows
        with `state: Expired` until it is replaced or revoked. Links are never
        listed: they exist only in the response that created them.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          description: Opaque; pass `nextCursor` from the previous page.
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationList" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/OrgNotActive" }
    post:
      operationId: createInvitation
      security: [{ session: [], csrf: [] }]
      summary: Invite someone by email (OrgOwner or OrgAdmin)
      description: |
        Creates a one-time link that works for 7 days (PRODUCT-PLAN §9.1),
        returned in `link` of this response only: send it by hand. Inviting
        an email again revokes its open invitation. A repeat of the request
        with the same `Idempotency-Key` returns the invitation without the
        link: revoke it and create a new one to get another link.
        `maxMembers` is checked now and again when the link is accepted.
      parameters:
        - $ref: "#/components/parameters/idempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvitationCreate" }
      responses:
        "201":
          description: Created; `link` is present here only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invitation" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: |
            `ORG_NOT_ACTIVE`: the organization is not approved yet.
            `ENTITLEMENT_EXCEEDED`: no room for another member (`details.limit` = `maxMembers`).
            `CONFLICT`: someone with this email is already a member.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422": { $ref: "#/components/responses/IdempotencyKeyReused" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /invitations/{invitation}:
    parameters:
      - name: invitation
        in: path
        required: true
        description: The token from the link for `GET`; the invitation id (`inv-…`) for `DELETE`.
        schema: { type: string, maxLength: 64 }
    get:
      operationId: previewInvitation
      summary: What an invitation link offers, before accepting it (any logged-in person)
      description: |
        The token is the capability: no membership is needed. The invited
        email is shown in full only to its owner, partly hidden otherwise.
        A link that expired, was used or was revoked gives 404 `INVITATION_INVALID`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationPreview" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: revokeInvitation
      security: [{ session: [], csrf: [] }]
      summary: Revoke an open invitation (OrgOwner or OrgAdmin of its organization)
      description: Its link stops working. Revoking it again changes nothing.
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: The invitation was already accepted or has expired (`CONFLICT`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /invitations/{token}:accept:
    parameters:
      - name: token
        in: path
        required: true
        description: The token from the invitation link.
        schema: { type: string, maxLength: 64 }
    post:
      operationId: acceptInvitation
      security: [{ session: [], csrf: [] }]
      summary: Join the organization of an invitation
      description: |
        Only with the verified email the invitation was sent to; another
        account gets 403 `INVITATION_EMAIL_MISMATCH` and the link keeps
        working for the right one. The link works once: a second accept,
        even at the same moment, gets 404 `INVITATION_INVALID`.
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      responses:
        "200":
          description: Joined; the organization as the new member sees it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: |
            `ENTITLEMENT_EXCEEDED`: the organization has no room for another member.
            `CONFLICT`: the caller is already a member.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422": { $ref: "#/components/responses/IdempotencyKeyReused" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /organizations/{orgId}/members:
    parameters:
      - $ref: "#/components/parameters/orgId"
    get:
      operationId: listMembers
      summary: Members of the organization with their groups (OrgOwner or OrgAdmin)
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          description: Opaque; pass `nextCursor` from the previous page.
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberList" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/OrgNotActive" }

  /organizations/{orgId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/orgId"
      - name: userId
        in: path
        required: true
        schema: { type: string, maxLength: 64 }
    patch:
      operationId: patchMember
      security: [{ session: [], csrf: [] }]
      summary: Make a member an OrgAdmin or an OrgMember (OrgOwner or OrgAdmin)
      description: |
        The owner's role changes only by transferring ownership (403). A
        recipient of a waiting transfer who stops being an OrgAdmin can no
        longer accept it: the transfer is cancelled.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberPatch" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/OrgNotActive" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      operationId: removeMember
      security: [{ session: [], csrf: [] }]
      summary: Remove a member from the organization (OrgOwner or OrgAdmin)
      description: |
        Never the owner (403). Portal access ends at once; the person leaves
        every group of the organization, and Kubernetes access ends within
        one token lifetime (5 minutes) once the groups are synced to
        Keycloak. The account itself stays: it belongs to the person.
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/OrgNotActive" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /organizations/{orgId}/members/me:leave:
    parameters:
      - $ref: "#/components/parameters/orgId"
    post:
      operationId: leaveOrganization
      security: [{ session: [], csrf: [] }]
      summary: Leave the organization (any member but the owner)
      description: The owner transfers ownership first (409 `LEAVE_NOT_ALLOWED`). Same effects as removal.
      responses:
        "204": { description: Left }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: The caller owns the organization (`LEAVE_NOT_ALLOWED`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /organizations/{orgId}:transfer-ownership:
    parameters:
      - $ref: "#/components/parameters/orgId"
    post:
      operationId: transferOwnership
      security: [{ session: [], csrf: [] }]
      summary: Offer the organization to one of its OrgAdmins (OrgOwner only)
      description: |
        The recipient sees the offer in the portal and accepts it there; no
        link or token (PRODUCT-PLAN §9.2). A new offer cancels the one
        waiting. The offer expires after 7 days.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransferCreate" }
      responses:
        "201":
          description: Offered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnershipTransfer" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403":
          description: The caller is not the owner (`TRANSFER_NOT_ALLOWED`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/OrgNotActive" }
        "422":
          description: The recipient is not an OrgAdmin of the organization (`RECIPIENT_NOT_ORG_ADMIN`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /organizations/{orgId}/ownership-transfer:
    parameters:
      - $ref: "#/components/parameters/orgId"
    get:
      operationId: getOwnershipTransfer
      summary: The ownership transfer waiting in the organization (its owner and its recipient)
      description: Anyone else, and anyone when none is waiting, gets 404.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnershipTransfer" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /ownership-transfers/{transferId}:accept:
    parameters:
      - $ref: "#/components/parameters/transferId"
    post:
      operationId: acceptOwnershipTransfer
      security: [{ session: [], csrf: [] }]
      summary: Become the owner (the recipient only)
      description: |
        Checked again at this moment: still waiting and not expired, the
        caller is the recipient and still an OrgAdmin, the proposer still
        the owner; otherwise 403 `TRANSFER_INVALID`. The old owner becomes an OrgAdmin.
      responses:
        "200":
          description: The organization, now owned by the caller
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /ownership-transfers/{transferId}:
    parameters:
      - $ref: "#/components/parameters/transferId"
    delete:
      operationId: cancelOwnershipTransfer
      security: [{ session: [], csrf: [] }]
      summary: Withdraw (the owner) or decline (the recipient) a waiting transfer
      description: Cancelling a transfer that already ended changes nothing; an accepted one is a conflict.
      responses:
        "204": { description: Cancelled }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: The transfer was already accepted (`CONFLICT`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /organizations/{orgId}/groups:
    parameters:
      - $ref: "#/components/parameters/orgId"
    get:
      operationId: listGroups
      summary: Groups of the organization with their members, by name (OrgOwner or OrgAdmin)
      description: |
        Not paged: at most `maxGroups`. `syncStatus` tells whether Keycloak
        has caught up; until a group is Synced it gives no Kubernetes access.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupList" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/OrgNotActive" }
    post:
      operationId: createGroup
      security: [{ session: [], csrf: [] }]
      summary: Create a group (OrgOwner or OrgAdmin)
      description: |
        Within `maxGroups`, which counts the three default groups. The group
        reaches Keycloak asynchronously (`syncStatus` Pending, then Synced).
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: |
            `ORG_NOT_ACTIVE`: the organization is not approved yet.
            `ENTITLEMENT_EXCEEDED`: no room for another group (`details.limit` = `maxGroups`).
            `CONFLICT`: the organization has a group with this name (`details.field` = `name`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422": { $ref: "#/components/responses/IdempotencyKeyReused" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /groups/{groupId}:
    parameters:
      - $ref: "#/components/parameters/groupId"
    patch:
      operationId: patchGroup
      security: [{ session: [], csrf: [] }]
      summary: Rename a group (OrgOwner or OrgAdmin of its organization)
      description: The display name only; the group's name in Keycloak and Kubernetes never changes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: The organization has a group with this name (`CONFLICT`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      operationId: deleteGroup
      security: [{ session: [], csrf: [] }]
      summary: Delete a group (OrgOwner or OrgAdmin of its organization)
      description: |
        Gone from the portal at once; removed from Keycloak asynchronously.
        Its members lose the Kubernetes access it gave within one token
        lifetime (5 minutes).
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: "`CONFLICT`: the group still has a role in a Workspace (`details.workspaceIds`); take the roles away first."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /groups/{groupId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/groupId"
      - name: userId
        in: path
        required: true
        schema: { type: string, maxLength: 64 }
    put:
      operationId: addGroupMember
      security: [{ session: [], csrf: [] }]
      summary: Add a member of the organization to the group (OrgOwner or OrgAdmin)
      description: Adding someone already in the group changes nothing. New access appears with their next token.
      responses:
        "204": { description: In the group }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      operationId: removeGroupMember
      security: [{ session: [], csrf: [] }]
      summary: Take someone out of the group (OrgOwner or OrgAdmin)
      description: |
        Removing someone not in the group changes nothing. Portal access
        follows at once; Kubernetes access within one token lifetime.
      responses:
        "204": { description: Not in the group }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /organizations/{orgId}/workspaces:
    parameters:
      - $ref: "#/components/parameters/orgId"
    get:
      operationId: listWorkspaces
      summary: Workspaces of the organization, oldest first
      description: |
        The OrgOwner and OrgAdmins see every Workspace; an OrgMember only
        those a group of theirs is bound to (architecture/06 §8). Not paged:
        at most `maxWorkspacesTotal`. Deleted Workspaces are not listed.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceList" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createWorkspace
      security: [{ session: [], csrf: [] }]
      summary: Create a Workspace (OrgOwner or OrgAdmin)
      description: |
        Answers 202 with the Workspace in Provisioning and the
        `workspace.create` operation to follow (PRODUCT-PLAN §17.1). Checked
        in this order: a non-member gets 404, an OrgMember 403, an
        organization not approved 409 `ORG_NOT_ACTIVE`. Only Shared
        Workspaces until Dedicated compute comes (M8).
      parameters:
        - $ref: "#/components/parameters/idempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceCreate" }
      responses:
        "202":
          description: Accepted; the cluster side follows asynchronously
          headers:
            Location:
              description: URL of the new Workspace
              required: true
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceAccepted" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: |
            `ORG_NOT_ACTIVE`: the organization is not approved yet.
            `SLUG_TAKEN`: another Workspace of the organization has this slug,
            or one that nests with it at a `-` (`solar` and `solar-prod`);
            `details.workspaceId` names it.
            `CLUSTER_NOT_GRANTED`: the organization has no grant on `clusterId`.
            `CLUSTER_NOT_READY`: the cluster is not Ready.
            `LAST_OWNER_BINDING`: no binding gives a group the TenantOwner role.
            `GROUP_SYNC_PENDING`: a bound group has not reached Keycloak yet
            (`details.groupId`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422": { $ref: "#/components/responses/IdempotencyKeyReused" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /organizations/{orgId}/workspaces:validate:
    parameters:
      - $ref: "#/components/parameters/orgId"
    post:
      operationId: validateWorkspace
      security: [{ session: [], csrf: [] }]
      summary: Check a Workspace before creating it (OrgOwner or OrgAdmin)
      description: |
        Runs the create to its end, with its locks and checks, then undoes
        it: the same errors as `POST .../workspaces`, nothing written. The
        wizard calls it when leaving each step (IMPLEMENTATION-PLAN §6.4).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceCreate" }
      responses:
        "200":
          description: It would be created so
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceValidation" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: The conflicts of `POST .../workspaces`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /organizations/{orgId}/audit-events:
    parameters:
      - $ref: "#/components/parameters/orgId"
    get:
      operationId: listAuditEvents
      summary: The organization's audit trail, newest first (OrgOwner or OrgAdmin)
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          description: Opaque; pass `nextCursor` from the previous page.
          schema: { type: string, maxLength: 20 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEventList" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/OrgNotActive" }

  /workspaces/{workspaceId}:
    parameters:
      - $ref: "#/components/parameters/workspaceId"
    get:
      operationId: getWorkspace
      summary: Workspace detail
      description: |
        The OrgOwner and OrgAdmins, and members of a group bound to it. Anyone
        else gets 404, a Platform Admin included (architecture/06 §8).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: patchWorkspace
      security: [{ session: [], csrf: [] }]
      summary: Change a Workspace's display name, quota or namespaceQuota (OrgOwner or OrgAdmin)
      description: |
        `resources` replaces the whole quota. A larger quota takes its share
        of the grant (`CLUSTER_GRANT_QUOTA_EXCEEDED`) and needs the cluster
        Ready; a smaller one goes neither below what the Pods use nor below
        the Namespaces the Workspace has (`WORKSPACE_QUOTA_BELOW_USAGE`).
        Answers 200 when nothing changes, otherwise 202 with the
        `workspace.update` operation (PRODUCT-PLAN §17.2).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspacePatch" }
      responses:
        "200":
          description: Unchanged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceChange" }
        "202":
          description: Changed; the cluster follows
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceChange" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: |
            `WORKSPACE_NOT_READY`: not Ready or Degraded, or an operation on it is under way.
            `CLUSTER_GRANT_QUOTA_EXCEEDED`: the larger quota does not fit in the grant (`details.resource`).
            `WORKSPACE_QUOTA_BELOW_USAGE`: below what the Workspace uses (`details.field`, `details.used`).
            `CLUSTER_NOT_READY`: resizing waits for the cluster.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      operationId: deleteWorkspace
      security: [{ session: [], csrf: [] }]
      summary: Delete a Workspace with its Namespaces, workloads and volumes (OrgOwner or OrgAdmin)
      description: |
        `confirmName` must be the Workspace's slug. From Ready, Cordoned,
        Degraded or Failed, with no operation under way. The Workspace is
        Deleting and keeps its share of the grant until the cluster is
        clean, then it is gone (PRODUCT-PLAN §17.4). A delete stuck on a
        finalizer is Blocked: retry, or a Platform Admin forces it.
      parameters:
        - name: confirmName
          in: query
          required: true
          schema: { type: string, maxLength: 20 }
      responses:
        "202":
          description: Accepted; follow the `workspace.delete` operation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceChange" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: "`WORKSPACE_NOT_READY`: an operation on it is under way, or it is being deleted already."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /workspaces/{workspaceId}:cordon:
    parameters:
      - $ref: "#/components/parameters/workspaceId"
    post:
      operationId: cordonWorkspace
      security: [{ session: [], csrf: [] }]
      summary: Freeze a Workspace (OrgOwner or OrgAdmin)
      description: |
        Tenants can change nothing in it; what runs keeps running
        (PRODUCT-PLAN §17.3). From Ready or Degraded; the Workspace is
        Cordoned once the `workspace.cordon` operation succeeds.
      responses:
        "200":
          description: Already so
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceChange" }
        "202":
          description: Accepted; the Workspace changes state once the cluster has done it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceChange" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: "`WORKSPACE_NOT_READY`: not in a state it can cordon from, or an operation on it is under way."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /workspaces/{workspaceId}:uncordon:
    parameters:
      - $ref: "#/components/parameters/workspaceId"
    post:
      operationId: uncordonWorkspace
      security: [{ session: [], csrf: [] }]
      summary: Unfreeze a Cordoned Workspace (OrgOwner or OrgAdmin)
      description: |
        The Workspace is Ready (or Degraded) again once the
        `workspace.uncordon` operation succeeds.
      responses:
        "200":
          description: Already so
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceChange" }
        "202":
          description: Accepted; the Workspace changes state once the cluster has done it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceChange" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: "`WORKSPACE_NOT_READY`: not in a state it can uncordon from, or an operation on it is under way."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /workspaces/{workspaceId}/usage:
    parameters:
      - $ref: "#/components/parameters/workspaceId"
    get:
      operationId: getWorkspaceUsage
      summary: What the Workspace's Pods use of its quota, in all and per Namespace (anyone who sees it)
      description: |
        As the controller last reported it, from the ResourceQuota of each
        Namespace; empty until it has.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceUsage" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/operations:
    parameters:
      - $ref: "#/components/parameters/workspaceId"
    get:
      operationId: listWorkspaceOperations
      summary: The Workspace's operations, newest first (anyone who sees it)
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationList" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/bindings:
    parameters:
      - $ref: "#/components/parameters/workspaceId"
    get:
      operationId: listWorkspaceBindings
      summary: Groups bound to the Workspace and their role (anyone who sees the Workspace)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceBindingList" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/bindings/{groupId}:
    parameters:
      - $ref: "#/components/parameters/workspaceId"
      - $ref: "#/components/parameters/groupId"
    put:
      operationId: putWorkspaceBinding
      security: [{ session: [], csrf: [] }]
      summary: Give a group of the organization a role in the Workspace (OrgOwner or OrgAdmin)
      description: |
        Answers 200 when the group already holds that role; otherwise 202
        with the `workspace.update` operation that reaches the cluster. The
        members get or lose `tenantry:tenant-users` and the role with their
        next token.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceBindingRole" }
      responses:
        "200":
          description: Unchanged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceBindingChange" }
        "202":
          description: Changed; the cluster follows
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceBindingChange" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: |
            `WORKSPACE_NOT_READY`: the Workspace is not Ready or Degraded, or an operation on it is under way.
            `LAST_OWNER_BINDING`: the group is the last TenantOwner.
            `GROUP_SYNC_PENDING`: the group has not reached Keycloak yet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      operationId: deleteWorkspaceBinding
      security: [{ session: [], csrf: [] }]
      summary: Take a group's role in the Workspace away (OrgOwner or OrgAdmin)
      description: |
        Answers 204 when the group holds no role; otherwise 202 with the
        `workspace.update` operation.
      responses:
        "202":
          description: Removed; the cluster follows
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceBindingChange" }
        "204": { description: The group holds no role in the Workspace }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: |
            `WORKSPACE_NOT_READY`: the Workspace is not Ready or Degraded, or an operation on it is under way.
            `LAST_OWNER_BINDING`: the group is the last TenantOwner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /workspaces/{workspaceId}/namespaces:
    parameters:
      - $ref: "#/components/parameters/workspaceId"
    get:
      operationId: listWorkspaceNamespaces
      summary: Namespaces of the Workspace, however created (anyone who sees the Workspace)
      description: |
        `source` tells a Namespace asked for on the portal from one created
        with kubectl or Headlamp; both count against `namespaceQuota`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceNamespaceList" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createWorkspaceNamespace
      security: [{ session: [], csrf: [] }]
      summary: Create a Namespace (OrgOwner, OrgAdmin, or a member of a group holding TenantOwner)
      description: |
        The body names the suffix; the Namespace is `<org>-<workspace>-<name>`.
        Answers 202 with the `namespace.create` operation; Developers and
        Viewers get 403.
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceNamespaceInput" }
      responses:
        "202":
          description: Accepted; the cluster follows
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceNamespaceChange" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: |
            `WORKSPACE_NOT_READY`: the Workspace is not Ready or Degraded, or an operation on it is under way.
            `CONFLICT`: a Namespace has this name (`details.field` = `name`), or the Workspace has as
            many Namespaces as `namespaceQuota` allows (`details.limit` = `namespaceQuota`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422": { $ref: "#/components/responses/IdempotencyKeyReused" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /workspaces/{workspaceId}/namespaces/{name}:
    parameters:
      - $ref: "#/components/parameters/workspaceId"
      - name: name
        in: path
        required: true
        description: The full name, e.g. `acme-solar-frontend`
        schema: { type: string, maxLength: 63 }
    delete:
      operationId: deleteWorkspaceNamespace
      security: [{ session: [], csrf: [] }]
      summary: Delete a Namespace with everything in it (OrgOwner, OrgAdmin, or a member of a group holding TenantOwner)
      description: Also a Namespace created with kubectl. Answers 202 with the `namespace.delete` operation.
      responses:
        "202":
          description: Accepted; the cluster follows
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceNamespaceChange" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: "`WORKSPACE_NOT_READY`: the Workspace is not Ready or Degraded, or an operation on it is under way."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /operations/{operationId}:
    parameters:
      - $ref: "#/components/parameters/operationId"
    get:
      operationId: getOperation
      summary: Progress of an asynchronous change (any member of its organization, or a Platform Admin)
      description: Anyone else gets 404. Poll until `state` is Succeeded, Failed or Blocked.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Operation" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /operations/{operationId}:retry:
    parameters:
      - $ref: "#/components/parameters/operationId"
    post:
      operationId: retryOperation
      security: [{ session: [], csrf: [] }]
      summary: Retry a Failed operation (OrgOwner, OrgAdmin or Platform Admin)
      description: The operation goes back to Pending and its undelivered changes are sent again at once.
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Operation" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: The operation is not Failed (`CONFLICT`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422": { $ref: "#/components/responses/IdempotencyKeyReused" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /operations/{operationId}/events:
    parameters:
      - $ref: "#/components/parameters/operationId"
    get:
      operationId: getOperationEvents
      summary: Follow an operation as server-sent events (who may read it)
      description: |
        Each event is `operation`, its data the same JSON as `GET
        /operations/{operationId}`: one at once, one at every change. The
        stream ends after Succeeded, Failed or Blocked, and after 10
        minutes; a comment line every 15 s keeps proxies from closing it.
        Polling `GET /operations/{operationId}` every 2 s does the same.
      responses:
        "200":
          description: An event stream
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /operations/{operationId}:force:
    parameters:
      - $ref: "#/components/parameters/operationId"
    post:
      operationId: forceOperation
      security: [{ session: [], csrf: [] }]
      summary: Force a Blocked Workspace delete past what holds it (Platform Admin)
      description: |
        The finalizer stops waiting for the Namespaces and deletes the
        Tenant; objects still held (volumes) are left for the Admin to
        clean up. Always audited (PRODUCT-PLAN §16.5).
      responses:
        "200":
          description: Running again
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Operation" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: "`CONFLICT`: not a Blocked Workspace delete."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /admin/organizations:
    get:
      operationId: adminListOrganizations
      summary: Every organization with its owner, oldest first (Platform Admin)
      description: |
        `?status=Pending` is the review queue, in arrival order. A Pending
        item carries `proposal`: what the active onboarding policy grants
        (PRODUCT-PLAN §5.2.1), for the Admin to approve as is or edit. Without
        an active policy it is absent and the Admin fills the form in.
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/OrgStatus" }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          description: Opaque; pass `nextCursor` from the previous page.
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOrganizationList" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createAdminOrganization
      security: [{ session: [], csrf: [] }]
      summary: Create an Active organization for a customer, with its owner, entitlement and default cluster grant (Platform Admin)
      description: |
        One transaction, like an approval (architecture/03-flows.md §2a): the
        organization is Active at once, the owner is its OrgOwner and joins
        `admins`, and the default groups reach Keycloak asynchronously. The
        owner must have logged in to the portal at least once (422
        `OWNER_USER_NOT_FOUND`): there is no invitation to become owner, since
        an organization is never without its one OrgOwner.
      parameters:
        - $ref: "#/components/parameters/idempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminOrganizationCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovedOrganization" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409":
          description: |
            `SLUG_TAKEN`: another organization has the slug.
            `CLUSTER_NOT_READY`: the grant's cluster is not Ready.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: |
            `OWNER_USER_NOT_FOUND`: nobody with this email has logged in.
            `IDEMPOTENCY_KEY_REUSED`: the key came with another request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /admin/organizations/{orgId}:
    parameters:
      - $ref: "#/components/parameters/adminOrgId"
    get:
      operationId: getAdminOrganization
      summary: One organization with its entitlement, cluster grants and usage (Platform Admin)
      description: |
        `usage` gives the same numbers as `GET /organizations/{orgId}/usage`.
        A Pending or Rejected request has no entitlement, grants or usage yet.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOrganizationDetail" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /admin/organizations/{orgId}/entitlement:
    parameters:
      - $ref: "#/components/parameters/adminOrgId"
    put:
      operationId: putAdminEntitlement
      security: [{ session: [], csrf: [] }]
      summary: Change an organization's entitlement (Platform Admin)
      description: |
        Every limit must stay at or above what the organization uses, and
        `maxGroups` at 3 or more (the default groups count): otherwise 409
        `ENTITLEMENT_BELOW_USAGE` with `details.limit` (the first limit too
        low), `details.used` and `details.requested`. The audit event keeps
        the values before and after.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Entitlement" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entitlement" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: |
            `ENTITLEMENT_BELOW_USAGE`: a limit below what is used.
            `ORG_NOT_ACTIVE`: a request still under review, or rejected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /admin/users:
    get:
      operationId: listAdminUsers
      summary: Users who have logged in, by email (Platform Admin)
      description: |
        Ordered by email. `q` keeps those whose email or display name
        contains it, case-insensitively.
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 254 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          description: Opaque; pass `nextCursor` from the previous page.
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserList" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /admin/users/{userId}:disable:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, maxLength: 64 }
    post:
      operationId: disableUser
      security: [{ session: [], csrf: [] }]
      summary: Disable a user's account (Platform Admin)
      description: |
        One transaction: `status=Disabled`, every portal session of the user
        ends, and the group sync worker disables the account in Keycloak
        (`syncStatus` Pending until it has). A Platform Admin cannot disable
        themselves. Disabling a disabled user changes nothing.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /admin/users/{userId}:enable:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, maxLength: 64 }
    post:
      operationId: enableUser
      security: [{ session: [], csrf: [] }]
      summary: Enable a disabled user's account again (Platform Admin)
      description: The group sync worker enables the account in Keycloak. Enabling an active user changes nothing.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /admin/organizations/{orgId}/cluster-grants/{clusterId}:
    parameters:
      - $ref: "#/components/parameters/adminOrgId"
      - $ref: "#/components/parameters/clusterId"
    put:
      operationId: putClusterGrant
      security: [{ session: [], csrf: [] }]
      summary: Give an Active organization a grant on a cluster, or change it (Platform Admin)
      description: |
        `clusterId` in the body must be the path's. A new grant needs a Ready
        cluster (409 `CLUSTER_NOT_READY`) and is the default when it is the
        organization's only one. The grant lists at least one network pool;
        every pool is on its cluster, a network pool shared or the
        organization's own. Changing a grant sends nothing to the cluster and
        never touches running Workspaces (PRODUCT-PLAN §5.5); the audit event
        keeps the values before and after.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClusterGrantInput" }
      responses:
        "200":
          description: Changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClusterGrant" }
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClusterGrant" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: |
            `CLUSTER_NOT_READY`: a new grant on a cluster that is not Ready.
            `ORG_NOT_ACTIVE`: the organization is not Active.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      operationId: deleteClusterGrant
      security: [{ session: [], csrf: [] }]
      summary: Take an organization's grant on a cluster away (Platform Admin)
      description: |
        Refused (409 `CONFLICT`, `details.dedicatedNodes`) while the
        organization holds dedicated nodes on the cluster. Deleting the
        default grant makes the oldest grant left the default.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: Dedicated nodes left (`CONFLICT`), or the organization is not Active (`ORG_NOT_ACTIVE`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /admin/cluster-grants:
    get:
      operationId: listAdminClusterGrants
      summary: Every grant of every organization, with what its Workspaces hold (Platform Admin)
      parameters:
        - name: clusterId
          in: query
          schema: { $ref: "#/components/schemas/PoolId" }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          description: Opaque; pass `nextCursor` from the previous page.
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminClusterGrantList" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /admin/clusters:
    get:
      operationId: listAdminClusters
      summary: The cluster registry (Platform Admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminClusterList" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: registerCluster
      security: [{ session: [], csrf: [] }]
      summary: Register a cluster; it stays Registered until an Admin marks it Ready (Platform Admin)
      parameters:
        - $ref: "#/components/parameters/idempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClusterCreate" }
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCluster" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409":
          description: A cluster with this id exists (`CONFLICT`, `details.field` = `id`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422": { $ref: "#/components/responses/IdempotencyKeyReused" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /admin/clusters/{clusterId}:
    parameters:
      - $ref: "#/components/parameters/clusterId"
    patch:
      operationId: patchCluster
      security: [{ session: [], csrf: [] }]
      summary: Change a cluster's metadata or status (Platform Admin)
      description: |
        Status moves as architecture/04-state-machines.md §6 allows, set by
        hand in the MVP: `Registered → Ready`, then among `Ready`,
        `Maintenance` and `Unavailable`; never back to `Registered` (409
        `CONFLICT`, `details.field` = `status`). `reservedCidrs` may not
        overlap a network pool of the cluster (409 `CIDR_OVERLAP`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClusterPatch" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCluster" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: A status change not allowed (`CONFLICT`), or reserved ranges overlapping a network pool (`CIDR_OVERLAP`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /admin/clusters/{clusterId}/nodes:
    parameters:
      - $ref: "#/components/parameters/clusterId"
    get:
      operationId: listClusterNodes
      summary: The nodes of a cluster as last reported, free, in a pool or dedicated (Platform Admin)
      description: |
        The operator reports them (PlatformNodeInventory) and the
        provisioning worker copies them here; the seed writes them once
        before the operator has.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClusterNodeList" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /admin/clusters/{clusterId}/shared-pools:
    parameters:
      - $ref: "#/components/parameters/clusterId"
    get:
      operationId: listSharedPools
      summary: A cluster's shared pools with their nodes and capacity (Platform Admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedPoolList" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createSharedPool
      security: [{ session: [], csrf: [] }]
      summary: Add a shared pool to a cluster (Platform Admin)
      description: |
        The id is a DNS label unique across clusters; `system` is the label
        of the system pool and refused. A node that joins must be free: a
        Ready worker of the cluster, in no pool and dedicated to nobody. A
        `sharedpool.update` operation has the operator label them.
      parameters:
        - $ref: "#/components/parameters/idempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SharedPoolCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedPool" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: A pool with this id exists (`CONFLICT`, `details.field` = `id`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422": { $ref: "#/components/responses/IdempotencyKeyReused" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /admin/clusters/{clusterId}/shared-pools/{poolId}:
    parameters:
      - $ref: "#/components/parameters/clusterId"
      - $ref: "#/components/parameters/poolId"
    put:
      operationId: putSharedPool
      security: [{ session: [], csrf: [] }]
      summary: Change a shared pool's name, overcommit ratio, system reserve and nodes (Platform Admin)
      description: |
        `nodes` is the whole list: a node left out leaves the pool (its Pods
        keep running: drain it yourself to take it out for good). A node
        that joins must be free. A change of nodes starts a
        `sharedpool.update` operation: the operator labels the pool's nodes
        and takes the label off the others. The audit event keeps before
        and after.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SharedPoolInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedPool" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /admin/clusters/{clusterId}/network-pools:
    parameters:
      - $ref: "#/components/parameters/clusterId"
    get:
      operationId: listNetworkPools
      summary: A cluster's network pools (Platform Admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NetworkPoolList" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createNetworkPool
      security: [{ session: [], csrf: [] }]
      summary: Add a network pool to a cluster (Platform Admin)
      description: |
        Its ranges overlap no other network pool of the cluster and none of
        the cluster's reserved ranges (409 `CIDR_OVERLAP`, `details.cidr`,
        `details.conflictsWith`). Without `organizationId` any
        organization's grant may list it.
      parameters:
        - $ref: "#/components/parameters/idempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NetworkPoolCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NetworkPool" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: A pool with this id exists (`CONFLICT`), or a range overlaps (`CIDR_OVERLAP`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422": { $ref: "#/components/responses/IdempotencyKeyReused" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /admin/clusters/{clusterId}/network-pools/{poolId}:
    parameters:
      - $ref: "#/components/parameters/clusterId"
      - $ref: "#/components/parameters/poolId"
    patch:
      operationId: patchNetworkPool
      security: [{ session: [], csrf: [] }]
      summary: Change a network pool's ranges or prefix lengths (Platform Admin)
      description: |
        A range added is checked like a new pool's. Only the database
        changes: CIDRs are handed out by the API.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NetworkPoolPatch" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NetworkPool" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: A range overlaps (`CIDR_OVERLAP`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /admin/organizations/{orgId}/cluster-grants/{clusterId}/dedicated-nodes:
    parameters:
      - $ref: "#/components/parameters/adminOrgId"
      - $ref: "#/components/parameters/clusterId"
    put:
      operationId: putDedicatedNodes
      security: [{ session: [], csrf: [] }]
      summary: Set the nodes an organization holds on a cluster (Platform Admin)
      description: |
        `nodes` is the whole set, under the organization's grant on the
        cluster (404 without one). A new node must be a worker of the cluster
        in no pool and dedicated to nobody; it starts `NotReady` until the
        operator has checked it. A node left out is revoked; a node kept
        takes the system reserve given. Each node given or taken back starts
        a `node.grant` or `node.revoke` operation. The audit event keeps
        before and after.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DedicatedNodesInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DedicatedNodeList" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: The organization is not Active (`ORG_NOT_ACTIVE`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /admin/health:
    get:
      operationId: getPlatformHealth
      summary: The parts the platform needs, the work in hand and each cluster's pools (Platform Admin)
      description: |
        Judged from the database: how long events and group changes have
        waited, the group sync worker's last failure, each cluster's status
        and last health check (every 30 s by the provisioning worker).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformHealth" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /admin/onboarding-policy:
    get:
      operationId: getOnboardingPolicy
      summary: What approving a request proposes (Platform Admin)
      description: 404 when no policy is active.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Approval" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: putOnboardingPolicy
      security: [{ session: [], csrf: [] }]
      summary: Replace the onboarding policy (Platform Admin)
      description: |
        `clusterGrant.clusterId` is the default cluster of new
        organizations. What the policy proposes must suit any organization:
        its network pools are shared ones. Grants already given are copies
        and do not change (PRODUCT-PLAN §5.2.1).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Approval" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Approval" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /admin/operations:
    get:
      operationId: listAdminOperations
      summary: Operations of every organization and of clusters, newest first (Platform Admin)
      parameters:
        - name: state
          in: query
          schema: { type: string, enum: [Pending, Running, Succeeded, Failed, Blocked] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          description: Opaque; pass `nextCursor` from the previous page.
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationList" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /admin/organizations/{orgId}:approve:
    parameters:
      - $ref: "#/components/parameters/adminOrgId"
    post:
      operationId: approveOrganization
      security: [{ session: [], csrf: [] }]
      summary: Approve an organization request with its entitlement and default cluster grant (Platform Admin)
      description: |
        One transaction (architecture/03-flows.md §1b): the organization
        becomes Active with the given entitlement and default cluster grant,
        the default groups `admins`, `developers` and `viewers` are created
        and the owner joins `admins`. The groups reach Keycloak
        asynchronously. Quantities are Kubernetes quantities; the response
        gives them back normalized (`4096Mi` becomes `4Gi`).
      parameters:
        - $ref: "#/components/parameters/idempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Approval" }
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovedOrganization" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: |
            `CONFLICT`: the request was already reviewed.
            `CLUSTER_NOT_READY`: the grant's cluster is not Ready.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422": { $ref: "#/components/responses/IdempotencyKeyReused" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /admin/organizations/{orgId}:reject:
    parameters:
      - $ref: "#/components/parameters/adminOrgId"
    post:
      operationId: rejectOrganization
      security: [{ session: [], csrf: [] }]
      summary: Reject an organization request with a reason the requester sees (Platform Admin)
      description: The slug is free again and the requester may file a new request.
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Rejection" }
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOrganization" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: The request was already reviewed (`CONFLICT`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422": { $ref: "#/components/responses/IdempotencyKeyReused" }
        "429": { $ref: "#/components/responses/RateLimited" }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-tenantry_session
      description: |
        Set by `GET /auth/callback`. HttpOnly: the SPA never sees it, the
        browser sends it. Lives as long as the Keycloak SSO session.
    csrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        The value of the `__Host-tenantry_csrf` cookie, required on every
        request that is not GET, HEAD or OPTIONS; missing or wrong gives
        `403 FORBIDDEN`.

  parameters:
    orgId:
      name: orgId
      in: path
      required: true
      description: |
        Organization id (`org-<ulid>`, 30 characters) or slug (at most 20
        characters), so the two can never be confused.
      schema: { type: string }

    operationId:
      name: operationId
      in: path
      required: true
      schema: { type: string }

    adminOrgId:
      name: orgId
      in: path
      required: true
      description: Organization id (`org-<ulid>`). Not a slug, which a Rejected and a Pending request may share.
      schema: { type: string }

    clusterId:
      name: clusterId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/PoolId" }

    poolId:
      name: poolId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/PoolId" }

    groupId:
      name: groupId
      in: path
      required: true
      schema: { type: string, maxLength: 64 }

    workspaceId:
      name: workspaceId
      in: path
      required: true
      schema: { type: string, maxLength: 64 }

    transferId:
      name: transferId
      in: path
      required: true
      schema: { type: string, maxLength: 64 }

    idempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: As `Idempotency-Key`, and required here (IMPLEMENTATION-PLAN §3.4).
      schema:
        type: string
        pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"

    idempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        A UUID the client generates once per intended change and sends again
        on every retry of it (IMPLEMENTATION-PLAN §3.4). A repeat of a request
        that succeeded gets the stored response, marked `Idempotent-Replayed:
        true`, and changes nothing. A request that failed stores nothing, so
        it can be corrected and sent again under the same key. Keys are per
        user and kept 24 hours.
      schema:
        type: string
        pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    OrgNotActive:
      description: "`ORG_NOT_ACTIVE`: the organization is Pending or Rejected, so it has no entitlement."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    IdempotencyKeyReused:
      description: "`IDEMPOTENCY_KEY_REUSED`: the key came before with another method, path or body."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    RateLimited:
      description: |
        `RATE_LIMITED`: more than 120 writes in a minute by this user
        (architecture/06-security-and-identity.md §6). Retry after the
        number of seconds in `Retry-After`.
      headers:
        Retry-After:
          required: true
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    ErrorCode:
      type: string
      description: Stable error codes the UI switches on (IMPLEMENTATION-PLAN §3.3). Grows with the endpoints.
      enum:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        - METHOD_NOT_ALLOWED
        - IDEMPOTENCY_KEY_REUSED
        - RATE_LIMITED
        - SLUG_TAKEN
        - ORG_REQUEST_PENDING
        - CLUSTER_NOT_READY
        - ORG_NOT_ACTIVE
        - ENTITLEMENT_EXCEEDED
        - INVITATION_INVALID
        - INVITATION_EMAIL_MISMATCH
        - TRANSFER_NOT_ALLOWED
        - RECIPIENT_NOT_ORG_ADMIN
        - TRANSFER_INVALID
        - LEAVE_NOT_ALLOWED
        - OWNER_USER_NOT_FOUND
        - ENTITLEMENT_BELOW_USAGE
        - CIDR_OVERLAP
        - CLUSTER_NOT_GRANTED
        - LAST_OWNER_BINDING
        - GROUP_SYNC_PENDING
        - WORKSPACE_NOT_READY
        - CLUSTER_GRANT_QUOTA_EXCEEDED
        - CLUSTER_GRANT_BELOW_ALLOCATION
        - WORKSPACE_QUOTA_BELOW_USAGE
        - ORGANIZATION_NOT_EMPTY
        - COMPUTE_POOL_CAPACITY_EXCEEDED
        - DEDICATED_NODE_NOT_GRANTED
        - DEDICATED_NODE_NOT_READY
        - DEDICATED_NODE_INSUFFICIENT_CAPACITY
        - CIDR_OUTSIDE_ALLOWED_POOL
        - NETWORK_POOL_EXHAUSTED
        - INTERNAL

    ErrorResponse:
      type: object
      required: [code, message, requestId]
      properties:
        code: { $ref: "#/components/schemas/ErrorCode" }
        message: { type: string }
        details:
          type: object
          description: Machine-readable context, e.g. the offending field or the exceeded quota.
          additionalProperties: true
        requestId: { type: string }

    Me:
      type: object
      required: [id, displayName, isPlatformAdmin]
      properties:
        id: { type: string }
        email: { type: string, description: Absent when the identity provider has none }
        displayName: { type: string }
        isPlatformAdmin:
          type: boolean
          description: The Keycloak realm role `platform-admin`; every admin endpoint checks it again server-side.

    Operation:
      type: object
      required: [id, resourceType, resourceId, type, state, progress, correlationId, createdAt, updatedAt]
      properties:
        id: { type: string }
        orgId: { type: string, description: "Absent on an operation on a cluster itself, e.g. sharedpool.update; only a Platform Admin sees those" }
        resourceType: { type: string, description: e.g. Workspace }
        resourceId: { type: string }
        type: { type: string, description: e.g. workspace.create }
        state:
          type: string
          enum: [Pending, Running, Succeeded, Failed, Blocked]
          description: |
            Pending: waiting to reach the cluster. Running: the cluster is working on it.
            Failed can be retried; Blocked needs a Platform Admin.
        progress: { type: integer, minimum: 0, maximum: 100 }
        errorCode: { type: string, description: "Set when Failed or Blocked, e.g. APPLY_FAILED" }
        errorMessage: { type: string }
        correlationId: { type: string, description: "Request id of the call that started it, for support" }
        createdBy: { type: string, description: User id; absent when the platform started it }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, description: "Set once Succeeded, Failed or Blocked" }

    OrgRole:
      type: string
      enum: [OrgOwner, OrgAdmin, OrgMember]

    Organization:
      type: object
      required: [id, slug, displayName, description, ownerUserId, status, reviewNote, createdAt]
      properties:
        id: { type: string }
        slug: { type: string, description: Immutable; prefix of every Kubernetes name }
        displayName: { type: string }
        description: { type: string }
        ownerUserId: { type: string }
        status:
          type: string
          description: Deleted organizations are not returned.
          enum: [Pending, Active, Rejected]
        reviewNote: { type: string, description: Why the request was rejected; empty otherwise }
        createdAt: { type: string, format: date-time }
        myRole: { $ref: "#/components/schemas/OrgRole" }

    OrganizationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Organization" }
        nextCursor: { type: string, description: Absent on the last page }

    OrganizationCreate:
      type: object
      required: [slug, displayName]
      additionalProperties: false
      properties:
        slug:
          type: string
          minLength: 3
          maxLength: 20
          pattern: "^[a-z][a-z0-9]*$"
        displayName: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 500 }

    OrganizationPatch:
      type: object
      additionalProperties: false
      properties:
        displayName: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 500 }

    OrgStatus:
      type: string
      enum: [Pending, Active, Rejected, Deleted]

    UserSummary:
      type: object
      required: [id, displayName]
      properties:
        id: { type: string }
        email: { type: string, description: Absent when Keycloak gave none }
        displayName: { type: string }

    AdminOrganization:
      type: object
      required: [id, slug, displayName, description, status, reviewNote, createdAt, owner]
      properties:
        id: { type: string }
        slug: { type: string }
        displayName: { type: string }
        description: { type: string }
        status: { $ref: "#/components/schemas/OrgStatus" }
        reviewNote: { type: string, description: Why the request was rejected; empty otherwise }
        createdAt: { type: string, format: date-time }
        owner: { $ref: "#/components/schemas/UserSummary" }
        proposal:
          description: Pending only, when an onboarding policy is active
          allOf: [{ $ref: "#/components/schemas/Approval" }]

    AdminOrganizationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminOrganization" }
        nextCursor: { type: string, description: Absent on the last page }

    Entitlement:
      type: object
      description: Limits that do not depend on a cluster (PRODUCT-PLAN §5.1).
      required: [maxMembers, maxGroups, maxWorkspacesTotal]
      additionalProperties: false
      properties:
        maxMembers: { type: integer, minimum: 1, maximum: 10000 }
        maxGroups:
          type: integer
          minimum: 0
          maximum: 1000
          description: |
            Includes the three default groups, so at least 3: fewer is
            `VALIDATION_FAILED` when approving or creating an organization,
            and `ENTITLEMENT_BELOW_USAGE` when changing an entitlement.
        maxWorkspacesTotal: { type: integer, minimum: 0, maximum: 1000 }

    WorkspaceRole:
      type: string
      enum: [TenantOwner, Developer, Viewer]
      description: "TenantOwner: owner of the Capsule Tenant. Developer, Viewer: tenantry:tenant-developer, tenantry:tenant-viewer (PRODUCT-PLAN §10.3)"

    WorkspaceState:
      type: string
      enum: [Provisioning, Ready, Updating, Cordoned, Degraded, Failed, Deleting]
      description: architecture/04-state-machines §1

    WorkspaceSlug:
      type: string
      minLength: 2
      maxLength: 20
      pattern: "^[a-z][a-z0-9]*(-[a-z0-9]+)*$"

    NamespaceSuffix:
      type: string
      minLength: 1
      maxLength: 42
      pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
      description: "The part after `<org>-<workspace>-`; the full name must fit 63 characters."

    WorkspaceResources:
      type: object
      description: |
        The quota every Namespace of the Workspace shares (PRODUCT-PLAN §5.4).
        Shared: limits at least the requests. Dedicated (M8): limits equal
        the requests and may be left out.
      required: [requestsCpu, requestsMemory, pods, requestsStorage, namespaceQuota]
      additionalProperties: false
      properties:
        requestsCpu: { $ref: "#/components/schemas/Quantity" }
        requestsMemory: { $ref: "#/components/schemas/Quantity" }
        limitsCpu: { $ref: "#/components/schemas/Quantity" }
        limitsMemory: { $ref: "#/components/schemas/Quantity" }
        pods: { type: integer, minimum: 1, maximum: 100000 }
        requestsStorage: { $ref: "#/components/schemas/Quantity" }
        namespaceQuota: { type: integer, minimum: 1, maximum: 100, description: "Namespaces the Workspace may hold, however created" }

    WorkspaceCompute:
      type: object
      required: [mode]
      additionalProperties: false
      properties:
        mode: { type: string, enum: [Shared, Dedicated] }
        sharedPoolId: { $ref: "#/components/schemas/PoolId" }
        dedicatedNodeGrantId: { type: string, maxLength: 64 }

    WorkspaceBindingInput:
      type: object
      required: [groupId, role]
      additionalProperties: false
      properties:
        groupId: { type: string, maxLength: 64 }
        role: { $ref: "#/components/schemas/WorkspaceRole" }

    WorkspaceCreate:
      type: object
      required: [slug, displayName, clusterId, compute, resources, bindings]
      additionalProperties: false
      properties:
        slug: { $ref: "#/components/schemas/WorkspaceSlug" }
        displayName: { type: string, minLength: 1, maxLength: 80 }
        clusterId: { type: string, maxLength: 63 }
        compute: { $ref: "#/components/schemas/WorkspaceCompute" }
        resources: { $ref: "#/components/schemas/WorkspaceResources" }
        namespaces:
          type: array
          description: Namespaces to create with the Workspace, as suffixes; they count against `namespaceQuota`.
          maxItems: 100
          uniqueItems: true
          items: { $ref: "#/components/schemas/NamespaceSuffix" }
        network: { $ref: "#/components/schemas/WorkspaceNetworkInput" }
        bindings:
          type: array
          description: Groups of the organization and their role; at least one TenantOwner, each group once.
          minItems: 1
          maxItems: 50
          items: { $ref: "#/components/schemas/WorkspaceBindingInput" }

    WorkspacePatch:
      type: object
      additionalProperties: false
      properties:
        displayName: { type: string, minLength: 1, maxLength: 80 }
        resources: { $ref: "#/components/schemas/WorkspaceResources" }

    WorkspaceChange:
      type: object
      required: [workspace]
      properties:
        workspace: { $ref: "#/components/schemas/Workspace" }
        operation:
          description: Set when something changed
          allOf: [{ $ref: "#/components/schemas/Operation" }]

    WorkspaceUsage:
      type: object
      required: [items, namespaces]
      properties:
        items:
          type: array
          description: Each quota of the Workspace, with what is used of it
          items: { $ref: "#/components/schemas/QuotaUse" }
        namespaces:
          type: array
          items: { $ref: "#/components/schemas/WorkspaceNamespace" }

    QuotaUse:
      type: object
      required: [resource, used, limit]
      properties:
        resource: { type: string, enum: [requestsCpu, requestsMemory, limitsCpu, limitsMemory, pods, requestsStorage] }
        used: { type: string, description: "A quantity; 0 until reported" }
        limit: { type: string }

    WorkspaceBindingRole:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role: { $ref: "#/components/schemas/WorkspaceRole" }

    WorkspaceBinding:
      type: object
      required: [groupId, groupName, role]
      properties:
        groupId: { type: string }
        groupName: { type: string }
        role: { $ref: "#/components/schemas/WorkspaceRole" }

    WorkspaceBindingList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/WorkspaceBinding" }

    WorkspaceBindingChange:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Every binding of the Workspace after the change
          items: { $ref: "#/components/schemas/WorkspaceBinding" }
        operation: { $ref: "#/components/schemas/Operation" }

    WorkspaceNamespaceInput:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { $ref: "#/components/schemas/NamespaceSuffix" }

    WorkspaceNamespace:
      type: object
      required: [name, source, state, usage, createdAt]
      properties:
        name: { type: string, description: "The full name, `<org>-<workspace>-<suffix>`" }
        source: { type: string, enum: [portal, kubectl] }
        state:
          type: string
          enum: [Desired, Creating, Active, Deleting]
          description: architecture/04-state-machines §9.2
        usage:
          type: object
          description: What its Pods request, from its ResourceQuota (e.g. `requests.cpu`); empty until reported.
          additionalProperties: { type: string }
        createdAt: { type: string, format: date-time }

    WorkspaceNamespaceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/WorkspaceNamespace" }

    WorkspaceNamespaceChange:
      type: object
      required: [namespace, operation]
      properties:
        namespace: { $ref: "#/components/schemas/WorkspaceNamespace" }
        operation: { $ref: "#/components/schemas/Operation" }

    WorkspaceNetworkInput:
      type: object
      description: |
        The Workspace's Pod address block (PRODUCT-PLAN §7.2). Left out: the
        grant's first network pool, its default prefix length, the first
        free block. `requestedCidr` (advanced) must be a free block of the pool.
      additionalProperties: false
      properties:
        networkPoolId: { $ref: "#/components/schemas/PoolId" }
        prefixLength: { type: integer, minimum: 16, maximum: 28 }
        requestedCidr: { type: string, maxLength: 18 }

    WorkspaceNetwork:
      type: object
      required: [networkPoolId, cidr, state]
      properties:
        networkPoolId: { type: string }
        cidr: { type: string }
        state: { type: string, enum: [Allocated, Releasing, Quarantined] }

    WorkspaceValidation:
      type: object
      required: [valid, network]
      properties:
        valid: { type: boolean, enum: [true] }
        network:
          type: object
          description: The block the Workspace would get now
          required: [networkPoolId, cidr]
          properties:
            networkPoolId: { type: string }
            cidr: { type: string }

    AuditEvent:
      type: object
      required: [id, at, action, targetType, targetId, result, detail]
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        actor:
          description: Absent when the platform acted on its own
          allOf: [{ $ref: "#/components/schemas/UserSummary" }]
        action: { type: string, description: e.g. workspace.create }
        targetType: { type: string }
        targetId: { type: string }
        result: { type: string }
        detail: { type: object, additionalProperties: true }

    AuditEventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditEvent" }
        nextCursor: { type: string }

    WorkspaceCondition:
      type: object
      required: [type, status, reason, message]
      properties:
        type: { type: string, description: "e.g. CapsuleTenantReady (architecture/04 §1.2)" }
        status: { type: string, enum: ["True", "False", "Unknown"] }
        reason: { type: string }
        message: { type: string }
        lastTransitionTime: { type: string, format: date-time }

    Workspace:
      type: object
      required: [id, orgId, clusterId, slug, k8sName, displayName, state, resources, compute, conditions, createdAt, updatedAt]
      properties:
        id: { type: string }
        orgId: { type: string }
        clusterId: { type: string }
        slug: { type: string }
        k8sName: { type: string, description: "`<org>-<slug>`: the Capsule Tenant and the prefix of its Namespaces" }
        displayName: { type: string }
        state: { $ref: "#/components/schemas/WorkspaceState" }
        resources: { $ref: "#/components/schemas/WorkspaceResources" }
        compute: { $ref: "#/components/schemas/WorkspaceCompute" }
        network:
          description: Absent on a Workspace created before network allocations
          allOf: [{ $ref: "#/components/schemas/WorkspaceNetwork" }]
        conditions:
          type: array
          description: As the controller last reported them; empty until it has.
          items: { $ref: "#/components/schemas/WorkspaceCondition" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    WorkspaceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Workspace" }

    WorkspaceAccepted:
      type: object
      required: [workspace, operation]
      properties:
        workspace: { $ref: "#/components/schemas/Workspace" }
        operation: { $ref: "#/components/schemas/Operation" }

    Quantity:
      type: string
      minLength: 1
      maxLength: 32
      description: A Kubernetes quantity, e.g. `500m` or `2` for CPU, `4Gi` for memory and storage.
      example: 4Gi

    GrantResources:
      type: object
      description: |
        CPU, memory and pods bound the organization's Shared Workspaces only;
        storage bounds every Workspace (PRODUCT-PLAN §5.2).
      required: [requestsCpu, requestsMemory, limitsCpu, limitsMemory, pods, requestsStorage]
      additionalProperties: false
      properties:
        requestsCpu: { $ref: "#/components/schemas/Quantity" }
        requestsMemory: { $ref: "#/components/schemas/Quantity" }
        limitsCpu: { $ref: "#/components/schemas/Quantity" }
        limitsMemory: { $ref: "#/components/schemas/Quantity" }
        pods: { type: integer, minimum: 0, maximum: 100000 }
        requestsStorage: { $ref: "#/components/schemas/Quantity" }

    PoolId:
      type: string
      maxLength: 63
      pattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$"

    ClusterGrantInput:
      type: object
      description: |
        What an organization may reserve on one cluster (PRODUCT-PLAN §5.2).
        Every pool must be on `clusterId`; a network pool must be shared or
        the organization's own. Shared mode is usable when `sharedPoolIds` is
        not empty.
      required: [clusterId, maxWorkspaces, maxNamespacesTotal, resources, sharedPoolIds, networkPoolIds, allowedStorageClasses]
      additionalProperties: false
      properties:
        clusterId: { type: string, maxLength: 63 }
        maxWorkspaces: { type: integer, minimum: 0, maximum: 1000 }
        maxNamespacesTotal: { type: integer, minimum: 0, maximum: 10000 }
        resources: { $ref: "#/components/schemas/GrantResources" }
        sharedPoolIds:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { $ref: "#/components/schemas/PoolId" }
        networkPoolIds:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: { $ref: "#/components/schemas/PoolId" }
        allowedStorageClasses:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { type: string, maxLength: 253 }

    ClusterGrant:
      type: object
      required: [id, isDefault, clusterId, maxWorkspaces, maxNamespacesTotal, resources, sharedPoolIds, networkPoolIds, allowedStorageClasses]
      properties:
        id: { type: string }
        isDefault: { type: boolean }
        clusterId: { type: string }
        maxWorkspaces: { type: integer }
        maxNamespacesTotal: { type: integer }
        resources: { $ref: "#/components/schemas/GrantResources" }
        sharedPoolIds: { type: array, items: { type: string } }
        networkPoolIds: { type: array, items: { type: string } }
        allowedStorageClasses: { type: array, items: { type: string } }

    Approval:
      type: object
      required: [entitlement, clusterGrant]
      additionalProperties: false
      properties:
        entitlement: { $ref: "#/components/schemas/Entitlement" }
        clusterGrant: { $ref: "#/components/schemas/ClusterGrantInput" }

    AdminCluster:
      type: object
      required: [id, displayName, status, proxyEndpoint, consoleUrl, appsDomain, reservedCidrs, createdAt]
      properties:
        id: { type: string }
        displayName: { type: string }
        status: { type: string, enum: [Registered, Ready, Maintenance, Unavailable] }
        proxyEndpoint: { type: string, description: "Capsule Proxy: the server of tenant kubeconfigs" }
        consoleUrl: { type: string, description: Headlamp }
        appsDomain: { type: string, description: "Routes are <name>-<workspace>.<appsDomain>" }
        reservedCidrs:
          type: array
          description: "Ranges the cluster already uses (Pod, Service, node CIDRs): network pools may not overlap them."
          items: { type: string }
        lastHealthCheck: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    AdminClusterList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminCluster" }

    ClusterCreate:
      type: object
      required: [id, displayName, proxyEndpoint, consoleUrl, appsDomain]
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/PoolId" }
        displayName: { type: string, minLength: 1, maxLength: 80 }
        proxyEndpoint: { type: string, maxLength: 2048 }
        consoleUrl: { type: string, maxLength: 2048 }
        appsDomain: { type: string, maxLength: 253 }
        reservedCidrs:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 43 }

    ClusterPatch:
      type: object
      additionalProperties: false
      properties:
        displayName: { type: string, minLength: 1, maxLength: 80 }
        status: { type: string, enum: [Registered, Ready, Maintenance, Unavailable] }
        proxyEndpoint: { type: string, maxLength: 2048 }
        consoleUrl: { type: string, maxLength: 2048 }
        appsDomain: { type: string, maxLength: 253 }
        reservedCidrs:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 43 }

    OrganizationRef:
      type: object
      required: [id, slug, displayName]
      properties:
        id: { type: string }
        slug: { type: string }
        displayName: { type: string }

    AdminClusterGrant:
      type: object
      required: [organization, clusterGrant, usage]
      properties:
        organization: { $ref: "#/components/schemas/OrganizationRef" }
        clusterGrant: { $ref: "#/components/schemas/ClusterGrant" }
        usage: { $ref: "#/components/schemas/GrantUsage" }

    AdminClusterGrantList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminClusterGrant" }
        nextCursor: { type: string }

    OperationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Operation" }
        nextCursor: { type: string }

    NodeCapacity:
      type: object
      required: [cpu, memory, pods]
      additionalProperties: false
      properties:
        cpu: { $ref: "#/components/schemas/Quantity" }
        memory: { $ref: "#/components/schemas/Quantity" }
        pods: { type: integer, minimum: 0, maximum: 100000 }

    ClusterNode:
      type: object
      required: [name, kind, ready, schedulable, allocatable, observedAt]
      properties:
        name: { type: string }
        kind: { type: string, enum: [ControlPlane, System, Worker] }
        ready: { type: boolean }
        schedulable: { type: boolean }
        allocatable: { $ref: "#/components/schemas/NodeCapacity" }
        sharedPoolId: { type: string }
        dedicatedTo: { $ref: "#/components/schemas/OrganizationRef" }
        observedAt: { type: string, format: date-time }

    ClusterNodeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ClusterNode" }

    SharedPoolInput:
      type: object
      required: [name, allocationOvercommitRatio, systemReserve, nodes]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        allocationOvercommitRatio: { type: number, minimum: 1, maximum: 99.99, multipleOf: 0.01 }
        systemReserve: { $ref: "#/components/schemas/NodeCapacity" }
        nodes:
          type: array
          maxItems: 200
          items: { type: string, maxLength: 253 }

    SharedPoolCreate:
      type: object
      required: [id, name, allocationOvercommitRatio, systemReserve, nodes]
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/PoolId" }
        name: { type: string, minLength: 1, maxLength: 80 }
        allocationOvercommitRatio: { type: number, minimum: 1, maximum: 99.99, multipleOf: 0.01 }
        systemReserve: { $ref: "#/components/schemas/NodeCapacity" }
        nodes:
          type: array
          maxItems: 200
          items: { type: string, maxLength: 253 }

    SharedPool:
      type: object
      required: [id, clusterId, name, allocationOvercommitRatio, systemReserve, nodes, capacity]
      properties:
        id: { type: string }
        clusterId: { type: string }
        name: { type: string }
        allocationOvercommitRatio: { type: number }
        systemReserve: { $ref: "#/components/schemas/NodeCapacity" }
        nodes:
          type: array
          items: { type: string }
        capacity:
          type: object
          description: "reservable = the nodes' allocatable less systemReserve per node; ceiling = ratio × reservable; allocated: what Shared Workspaces hold"
          required: [reservable, ceiling, allocated]
          properties:
            reservable: { $ref: "#/components/schemas/NodeCapacity" }
            ceiling: { $ref: "#/components/schemas/NodeCapacity" }
            allocated: { $ref: "#/components/schemas/NodeCapacity" }
        operation:
          description: "Set when the change gave the pool other nodes: the `sharedpool.update` that labels them on the cluster"
          allOf: [{ $ref: "#/components/schemas/Operation" }]

    PlatformHealth:
      type: object
      required: [components, work, clusters]
      properties:
        components:
          type: array
          items: { $ref: "#/components/schemas/HealthComponent" }
        work:
          type: object
          required: [operationsRunning, operationsNeedingAttention, syncWaiting, requestsWaiting]
          properties:
            operationsRunning: { type: integer, description: Pending or Running }
            operationsNeedingAttention: { type: integer, description: Failed or Blocked }
            syncWaiting: { type: integer, description: "Group, member and account changes Keycloak does not have yet" }
            requestsWaiting: { type: integer, description: Organization requests waiting for review }
        clusters:
          type: array
          items: { $ref: "#/components/schemas/HealthCluster" }

    HealthComponent:
      type: object
      required: [name, state, detail]
      properties:
        name: { type: string }
        state: { type: string, enum: [ok, warn] }
        detail: { type: string }

    HealthCluster:
      type: object
      required: [id, displayName, status, pools]
      properties:
        id: { type: string }
        displayName: { type: string }
        status: { type: string, enum: [Registered, Ready, Maintenance, Unavailable] }
        lastHealthCheck: { type: string, format: date-time }
        pools:
          type: array
          items: { $ref: "#/components/schemas/HealthPool" }

    HealthPool:
      type: object
      required: [id, name, allocated, ceiling]
      properties:
        id: { type: string }
        name: { type: string }
        allocated: { $ref: "#/components/schemas/NodeCapacity" }
        ceiling: { $ref: "#/components/schemas/NodeCapacity" }

    SharedPoolList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SharedPool" }

    NetworkPoolCreate:
      type: object
      required: [id, cidrs, defaultPrefixLength, allowedPrefixLengths]
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/PoolId" }
        organizationId: { type: string, maxLength: 64, description: "Absent: a pool any organization's grant may list" }
        cidrs:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: string, maxLength: 18 }
        defaultPrefixLength: { type: integer, minimum: 8, maximum: 28 }
        allowedPrefixLengths:
          type: array
          minItems: 1
          maxItems: 21
          items: { type: integer, minimum: 8, maximum: 28 }

    NetworkPoolPatch:
      type: object
      additionalProperties: false
      properties:
        cidrs:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: string, maxLength: 18 }
        defaultPrefixLength: { type: integer, minimum: 8, maximum: 28 }
        allowedPrefixLengths:
          type: array
          minItems: 1
          maxItems: 21
          items: { type: integer, minimum: 8, maximum: 28 }

    NetworkPool:
      type: object
      required: [id, clusterId, cidrs, defaultPrefixLength, allowedPrefixLengths]
      properties:
        id: { type: string }
        clusterId: { type: string }
        organizationId: { type: string }
        cidrs:
          type: array
          items: { type: string }
        defaultPrefixLength: { type: integer }
        allowedPrefixLengths:
          type: array
          items: { type: integer }

    NetworkPoolList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/NetworkPool" }

    DedicatedNodesInput:
      type: object
      required: [nodes]
      additionalProperties: false
      properties:
        nodes:
          type: array
          maxItems: 200
          items:
            type: object
            required: [name, systemReserve]
            additionalProperties: false
            properties:
              name: { type: string, maxLength: 253 }
              systemReserve: { $ref: "#/components/schemas/NodeCapacity" }

    DedicatedNode:
      type: object
      required: [id, clusterId, name, allocatable, systemReserve, reservable, reserved, remaining, nodeState, capacityState]
      properties:
        id: { type: string }
        clusterId: { type: string }
        name: { type: string }
        allocatable: { $ref: "#/components/schemas/NodeCapacity" }
        systemReserve: { $ref: "#/components/schemas/NodeCapacity" }
        reservable: { $ref: "#/components/schemas/NodeCapacity" }
        reserved: { $ref: "#/components/schemas/NodeCapacity" }
        remaining: { $ref: "#/components/schemas/NodeCapacity" }
        nodeState: { type: string, enum: [Ready, NotReady, Cordoned] }
        capacityState: { type: string, enum: [Available, PartiallyAllocated, FullyAllocated, Overcommitted] }

    DedicatedNodeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DedicatedNode" }
        operations:
          type: array
          description: "On a change: a `node.grant` per node given and a `node.revoke` per node taken back, which the cluster follows"
          items: { $ref: "#/components/schemas/Operation" }

    OrgCluster:
      type: object
      description: A cluster as an organization sees it, without the ranges it reserves.
      required: [id, displayName, status, proxyEndpoint, consoleUrl, appsDomain, grantId, isDefault, sharedPools, dedicatedNodes]
      properties:
        id: { type: string }
        displayName: { type: string }
        status: { type: string, enum: [Registered, Ready, Maintenance, Unavailable] }
        proxyEndpoint: { type: string }
        consoleUrl: { type: string }
        appsDomain: { type: string }
        grantId: { type: string }
        isDefault: { type: boolean, description: The organization's default cluster }
        sharedPools: { type: integer, description: Shared pools the grant lists }
        dedicatedNodes: { type: integer, description: Nodes dedicated to the organization there }

    OrgClusterList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/OrgCluster" }

    ComputeOptions:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [mode, available]
            properties:
              mode: { type: string, enum: [Shared, Dedicated] }
              available: { type: boolean }
              reason: { type: string, description: Why the mode cannot be chosen }

    OrgSharedPool:
      type: object
      description: A shared pool as a summary; its nodes are not shown.
      required: [id, name, nodeCount, capacity]
      properties:
        id: { type: string }
        name: { type: string }
        nodeCount: { type: integer }
        capacity:
          type: object
          description: "ceiling: what all Workspaces on the pool may reserve; allocated: what they do"
          required: [ceiling, allocated]
          properties:
            ceiling: { $ref: "#/components/schemas/NodeCapacity" }
            allocated: { $ref: "#/components/schemas/NodeCapacity" }

    OrgSharedPoolList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/OrgSharedPool" }

    OrgDedicatedNode:
      type: object
      required: [id, name, nodeState, capacityState, reservable, reserved, remaining, workspaces]
      properties:
        id: { type: string, description: The node grant's id }
        name: { type: string }
        nodeState: { type: string, enum: [Ready, NotReady, Cordoned] }
        capacityState: { type: string, enum: [Available, PartiallyAllocated, FullyAllocated, Overcommitted] }
        reservable: { $ref: "#/components/schemas/NodeCapacity" }
        reserved: { $ref: "#/components/schemas/NodeCapacity" }
        remaining: { $ref: "#/components/schemas/NodeCapacity" }
        workspaces:
          type: array
          description: The organization's Workspaces holding a reservation on the node
          items: { type: string }

    OrgDedicatedNodeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/OrgDedicatedNode" }

    OrgNetworkPool:
      type: object
      required: [id, cidrs, defaultPrefixLength, allowedPrefixLengths, shared]
      properties:
        id: { type: string }
        cidrs:
          type: array
          items: { type: string }
        defaultPrefixLength: { type: integer }
        allowedPrefixLengths:
          type: array
          items: { type: integer }
        shared: { type: boolean, description: "Any organization's grant may list it; false: the organization's own" }

    NetworkPoolAvailability:
      type: object
      required: [id, cidrs, defaultPrefixLength, free, blocks]
      properties:
        id: { type: string }
        cidrs:
          type: array
          items: { type: string }
        defaultPrefixLength: { type: integer }
        free:
          type: array
          description: Free blocks at each allowed prefix length
          items: { $ref: "#/components/schemas/FreeBlocks" }
        blocks:
          type: array
          description: The organization's own blocks in the pool
          items: { $ref: "#/components/schemas/NetworkBlock" }

    FreeBlocks:
      type: object
      required: [prefixLength, blocks]
      properties:
        prefixLength: { type: integer }
        blocks: { type: integer }

    NetworkBlock:
      type: object
      required: [workspace, cidr, state]
      properties:
        workspace: { type: string, description: "The Workspace's k8s name" }
        cidr: { type: string }
        state: { type: string, enum: [Allocated, Releasing, Quarantined] }

    OrgNetworkPoolList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/OrgNetworkPool" }

    AdminOrganizationCreate:
      type: object
      required: [slug, displayName, ownerEmail, entitlement, clusterGrant]
      additionalProperties: false
      properties:
        slug: { type: string, minLength: 3, maxLength: 20 }
        displayName: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 500 }
        ownerEmail: { type: string, minLength: 3, maxLength: 254, description: Compared lowercase }
        entitlement: { $ref: "#/components/schemas/Entitlement" }
        clusterGrant: { $ref: "#/components/schemas/ClusterGrantInput" }

    AdminOrganizationDetail:
      type: object
      required: [organization, clusterGrants]
      properties:
        organization: { $ref: "#/components/schemas/AdminOrganization" }
        entitlement: { $ref: "#/components/schemas/Entitlement" }
        clusterGrants:
          type: array
          items: { $ref: "#/components/schemas/ClusterGrant" }
        dedicatedNodes:
          type: array
          description: The nodes the organization holds, on every cluster.
          items: { $ref: "#/components/schemas/DedicatedNode" }
        usage: { $ref: "#/components/schemas/OrganizationUsage" }

    AdminUser:
      type: object
      required: [id, displayName, status, syncStatus, createdAt]
      properties:
        id: { type: string }
        email: { type: string }
        displayName: { type: string }
        status: { type: string, enum: [Active, Disabled] }
        syncStatus: { $ref: "#/components/schemas/SyncStatus" }
        createdAt: { type: string, format: date-time }

    AdminUserList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminUser" }
        nextCursor: { type: string }

    ApprovedOrganization:
      type: object
      required: [organization, entitlement, clusterGrant]
      properties:
        organization: { $ref: "#/components/schemas/AdminOrganization" }
        entitlement: { $ref: "#/components/schemas/Entitlement" }
        clusterGrant: { $ref: "#/components/schemas/ClusterGrant" }

    Rejection:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }

    OrganizationEntitlement:
      type: object
      required: [entitlement, clusterGrants]
      properties:
        entitlement: { $ref: "#/components/schemas/Entitlement" }
        clusterGrants:
          type: array
          items: { $ref: "#/components/schemas/ClusterGrant" }

    UsageCount:
      type: object
      required: [used, limit]
      properties:
        used: { type: integer }
        limit: { type: integer }

    AllocatedCount:
      type: object
      required: [allocated, limit, remaining]
      properties:
        allocated: { type: integer }
        limit: { type: integer }
        remaining: { type: integer }

    AllocatedQuantity:
      type: object
      required: [allocated, limit, remaining]
      properties:
        allocated: { $ref: "#/components/schemas/Quantity" }
        limit: { $ref: "#/components/schemas/Quantity" }
        remaining: { $ref: "#/components/schemas/Quantity" }

    GrantUsage:
      type: object
      description: CPU, memory and pods count Shared Workspaces only; the rest count every Workspace (PRODUCT-PLAN §5.2).
      required: [grantId, clusterId, isDefault, workspaces, namespaces, requestsCpu, requestsMemory, limitsCpu, limitsMemory, pods, requestsStorage]
      properties:
        grantId: { type: string }
        clusterId: { type: string }
        isDefault: { type: boolean }
        workspaces: { $ref: "#/components/schemas/AllocatedCount" }
        namespaces: { $ref: "#/components/schemas/AllocatedCount" }
        requestsCpu: { $ref: "#/components/schemas/AllocatedQuantity" }
        requestsMemory: { $ref: "#/components/schemas/AllocatedQuantity" }
        limitsCpu: { $ref: "#/components/schemas/AllocatedQuantity" }
        limitsMemory: { $ref: "#/components/schemas/AllocatedQuantity" }
        pods: { $ref: "#/components/schemas/AllocatedCount" }
        requestsStorage: { $ref: "#/components/schemas/AllocatedQuantity" }

    OrganizationUsage:
      type: object
      required: [organization, clusterGrants]
      properties:
        organization:
          type: object
          required: [members, groups, workspaces]
          properties:
            members: { $ref: "#/components/schemas/UsageCount" }
            groups:
              description: Groups waiting to be removed do not count.
              allOf: [{ $ref: "#/components/schemas/UsageCount" }]
            workspaces: { $ref: "#/components/schemas/UsageCount" }
        clusterGrants:
          type: array
          items: { $ref: "#/components/schemas/GrantUsage" }

    InvitationRole:
      type: string
      description: Never OrgOwner; ownership is transferred.
      enum: [OrgAdmin, OrgMember]

    InvitationCreate:
      type: object
      required: [email, role]
      additionalProperties: false
      properties:
        email: { type: string, minLength: 3, maxLength: 254, description: Compared lowercase }
        role: { $ref: "#/components/schemas/InvitationRole" }
        groupIds:
          type: array
          description: Groups of the organization the person joins on accepting.
          maxItems: 20
          uniqueItems: true
          items: { type: string, maxLength: 64 }

    Invitation:
      type: object
      required: [id, orgId, email, role, groupIds, invitedBy, state, expiresAt, createdAt]
      properties:
        id: { type: string }
        orgId: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/InvitationRole" }
        groupIds: { type: array, items: { type: string } }
        invitedBy: { $ref: "#/components/schemas/UserSummary" }
        state:
          type: string
          description: Expired once the link stopped working (7 days).
          enum: [Pending, Expired]
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        link:
          type: string
          description: The one-time link; only in the response that created the invitation, never stored.

    InvitationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Invitation" }
        nextCursor: { type: string, description: Absent on the last page }

    InvitationPreview:
      type: object
      required: [orgId, orgName, orgSlug, role, email, emailMatches, invitedBy, groupNames, expiresAt, alreadyMember]
      properties:
        orgId: { type: string }
        orgName: { type: string }
        orgSlug: { type: string }
        role: { $ref: "#/components/schemas/InvitationRole" }
        email: { type: string, description: The invited address; partly hidden unless it is the caller's own }
        emailMatches: { type: boolean, description: Whether the caller's verified email is the invited one }
        invitedBy: { type: string, description: Display name of who invited }
        groupNames: { type: array, items: { type: string } }
        expiresAt: { type: string, format: date-time }
        alreadyMember: { type: boolean }

    GroupRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }

    Member:
      type: object
      required: [userId, displayName, role, joinedAt, groups]
      properties:
        userId: { type: string }
        email: { type: string, description: Absent when Keycloak gave none }
        displayName: { type: string }
        role: { $ref: "#/components/schemas/OrgRole" }
        joinedAt: { type: string, format: date-time }
        groups:
          type: array
          description: Groups of this organization the member is in, by name.
          items: { $ref: "#/components/schemas/GroupRef" }

    MemberList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Member" }
        nextCursor: { type: string, description: Absent on the last page }

    MemberPatch:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role: { $ref: "#/components/schemas/InvitationRole" }

    TransferCreate:
      type: object
      required: [toUserId]
      additionalProperties: false
      properties:
        toUserId: { type: string, maxLength: 64, description: An OrgAdmin of the organization }

    OwnershipTransfer:
      type: object
      required: [id, orgId, from, to, state, expiresAt, createdAt]
      properties:
        id: { type: string }
        orgId: { type: string }
        from: { $ref: "#/components/schemas/UserSummary" }
        to: { $ref: "#/components/schemas/UserSummary" }
        state: { type: string, enum: [Proposed] }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    SyncStatus:
      type: string
      description: Whether Keycloak has caught up with this row (04-state-machines §9.1).
      enum: [Pending, Synced, Error]

    GroupInput:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 63 }

    GroupMember:
      type: object
      required: [userId, displayName, syncStatus]
      properties:
        userId: { type: string }
        displayName: { type: string }
        email: { type: string }
        syncStatus: { $ref: "#/components/schemas/SyncStatus" }

    Group:
      type: object
      required: [id, orgId, name, machineName, syncStatus, members, createdAt]
      properties:
        id: { type: string }
        orgId: { type: string }
        name: { type: string }
        machineName: { type: string, description: "The group's name in Keycloak and in Kubernetes RBAC: org_<ulid>:group_<ulid>" }
        syncStatus: { $ref: "#/components/schemas/SyncStatus" }
        members:
          type: array
          items: { $ref: "#/components/schemas/GroupMember" }
        createdAt: { type: string, format: date-time }

    GroupList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Group" }
