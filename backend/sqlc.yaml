# sqlc reads the goose migrations as the schema (it skips the Down sections)
# and turns each named query in internal/store/queries into a typed Go method.
version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/store/queries
    gen:
      go:
        package: store
        out: internal/store
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          # pgtype.Timestamptz otherwise; every timestamp column here is NOT NULL.
          - db_type: timestamptz
            go_type: time.Time
