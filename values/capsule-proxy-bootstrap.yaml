options:
  capsuleConfigurationName: default
  authPreferredTypes: BearerToken,TLSCertificate
  oidcUsernameClaim: preferred_username
  roleBindingReflector: true
  logLevel: 3

service:
  type: ClusterIP
  port: 9001

serviceMonitor:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 300m
    memory: 256Mi

