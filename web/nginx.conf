# The portal's static files (deploy/Dockerfile.web). /api and /auth never
# reach this server: the Ingress sends them to the Platform API.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 512; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  server_tokens off;
  sendfile on;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Read-only root filesystem: everything nginx writes goes to /tmp.
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  server {
    listen 8080;
    root /usr/share/nginx/html;

    include /etc/nginx/security-headers.conf;

    # Hashed file names never change: cache them for good.
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      include /etc/nginx/security-headers.conf;
      try_files $uri =404;
    }

    location = /healthz { access_log off; return 200 "ok\n"; }

    # Every other path is a route of the single-page app; index.html is
    # always fetched fresh so a deploy takes effect on the next load.
    location / {
      add_header Cache-Control "no-cache";
      include /etc/nginx/security-headers.conf;
      try_files $uri /index.html;
    }
  }
}
