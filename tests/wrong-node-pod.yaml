apiVersion: v1
kind: Pod
metadata:
  name: wrong-node
  namespace: solar-dev
spec:
  nodeSelector:
    capsule.clastix.io/tenant: water
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: web
      image: docker.io/nginxinc/nginx-unprivileged:1.27-alpine
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 10m
          memory: 16Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
