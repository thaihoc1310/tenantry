apiVersion: v1
kind: Pod
metadata:
  name: should-deny-untrusted-registry
  namespace: solar-dev
spec:
  restartPolicy: Never
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: test
      image: untrusted.example.invalid/demo:1
      imagePullPolicy: IfNotPresent
      command: ["sleep", "10"]
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 50m
          memory: 32Mi
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]

